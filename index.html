<style>
/* Layout: sidebar de navigation + barre d'outils collante propre à chaque onglet + vues (dashboard, planning, ventes, paies, historique, équipe) */
/* deux thèmes au choix (bouton en bas du menu) : clair, ou nuit bleu profond ; vert doux comme couleur principale */
:root {
  color-scheme: light;
  --bg: #F3F5F4; --surface: #FFFFFF; --surface-2: #EAEEEC; --line: #DCE2DF;
  --fg: #17201C; --muted: #63706A; --accent: #2E7A5A; --accent-fg: #FFFFFF; --accent-soft: #E1F0E8;
  --good: #1D8556; --good-soft: #E1F3EA; --warn: #A86A12; --warn-soft: #FBF0DC; --bad: #C0392B; --bad-soft: #FBE6E3; --info: #2F65B0; --info-soft: #E3ECF8;
  --shadow: 0 1px 2px rgba(23,32,28,.05), 0 6px 20px rgba(23,32,28,.06);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --sl-matin: #B07A12; --sl-aprem: #C0582A; --sl-soir: #7A4FBF; --sl-nuit: #2F5DA8;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B0F17; --surface: #121826; --surface-2: #1A2232; --line: #263044;
  --fg: #ECEFF6; --muted: #8C96AB; --accent: #5BAE8C; --accent-fg: #08160F; --accent-soft: #132B25;
  --good: #4CC992; --good-soft: #12291F; --warn: #E8AE52; --warn-soft: #2E2614; --bad: #F27A66; --bad-soft: #33191A; --info: #7FAAEA; --info-soft: #16233A;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #2f9e3a; --s7: #9085e9; --s8: #e66767;
  --sl-matin: #E0AE4E; --sl-aprem: #E8875C; --sl-soir: #A98BE8; --sl-nuit: #79A3E3;
}
.thm { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--surface-2); align-self: flex-start }
.thm button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 7px; font-size: 12px; font-weight: 700; color: var(--muted) }
.thm button svg { width: 13px; height: 13px }
.thm button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12) }
.thm button:focus-visible { outline: 2px solid var(--accent) }
.mnav .thm-m { margin-left: auto; flex: none; display: grid; place-items: center }
.mnav .thm-m svg { width: 16px; height: 16px; display: block }
* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--fg) }
body { font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased }
button, input, select, textarea { font: inherit; color: inherit }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -.01em }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px }
.tn { font-variant-numeric: tabular-nums }

.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 22px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px }
.brand .logo { width: 52px; height: 38px; border-radius: 9px; object-fit: cover; flex: none; display: block; box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent), 0 2px 6px rgba(80, 55, 20, .18) }
.brand b { font: 700 18px var(--f-display); display: block; line-height: 1.1 }
.brand small { color: var(--muted); font-size: 11.5px }
.nav { display: flex; flex-direction: column; gap: 2px }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--muted); font-weight: 700 }
.nav button svg { width: 18px; height: 18px; flex: none }
.nav button:hover { background: var(--surface-2); color: var(--fg) }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent) }
.nav button:focus-visible { outline: 2px solid var(--accent) }
.nav button.nsub { margin-left: 18px; padding: 7px 10px; font-size: 13.5px; gap: 9px; position: relative }
.nav button.nsub svg { width: 16px; height: 16px }
.nav button.nsub::before { content: ""; position: absolute; left: -9px; top: 4px; bottom: 4px; border-left: 1.5px solid var(--line) }
.side-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 8px; display: flex; flex-direction: column; gap: 6px }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px }
.dot.off { background: var(--warn) }

.main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px }
.inner { max-width: 1240px; margin: 0 auto }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 16px 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); margin-bottom: 20px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.topbar h1 { font-size: 24px }
.topbar .sub { color: var(--muted); font-size: 13px }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap }
.seg button { all: unset; cursor: pointer; padding: 5px 11px; border-radius: 7px; font-weight: 700; font-size: 12.5px; color: var(--muted); white-space: nowrap }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow) }
.seg button:focus-visible { outline: 2px solid var(--accent) }
.stepper { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted) }
.stepper input[type=date] { width: 140px; padding: 6px 8px; font-size: 13px }
.stepper .lbl { font-weight: 700; color: var(--fg); font-size: 13.5px; min-width: 120px; text-align: center }
.navstep { all: unset; cursor: pointer; min-width: 30px; height: 30px; padding: 0 6px; box-sizing: border-box; display: grid; place-items: center; border-radius: 8px; background: var(--surface-2); color: var(--fg); font-weight: 700; font-size: 12.5px }
.navstep:hover { background: var(--line) }
.navstep:focus-visible { outline: 2px solid var(--accent) }

.banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 13px; margin-bottom: 16px }
.subnav { margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0 }
.card h2 { font-size: 16px }
.hint { color: var(--muted); font-size: 12.5px; margin: 2px 0 0 }
.card-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px }
.grid { display: grid; gap: 16px }
.g2 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr) }
.g2e { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.mt { margin-top: 16px }

.kpis { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 12px; margin-bottom: 16px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; min-width: 0 }
.kpi .l { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.kpi .v { font: 700 24px/1.15 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.kpi .s { font-size: 12px; color: var(--muted) }
.kpi .v:has(input) { white-space: normal; flex-wrap: wrap; overflow: visible }
.kpi.hl { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
.kpi.hl .l, .kpi.hl .s { color: var(--accent-fg); opacity: .85 }
.delta { font-weight: 800; font-size: 12px }
.delta.up { color: var(--good) } .delta.down { color: var(--bad) } .delta.flat { color: var(--muted) }
.kpi.hl .delta { color: var(--accent-fg) }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px }
.chart { position: relative; margin-top: 10px }
.chart svg { display: block; width: 100%; height: auto; overflow: visible }
.chart text { fill: var(--muted); font: 11px var(--f-body) }
.chart .gl { stroke: var(--line); stroke-width: 1 }
.chart rect.hit { fill: transparent; cursor: pointer }
.chart rect.hit:hover { fill: var(--surface-2); opacity: .6 }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); padding: 8px 10px; border-radius: 8px; font-size: 12px; white-space: nowrap; z-index: 3; box-shadow: var(--shadow) }
.tip div { display: flex; justify-content: space-between; gap: 14px }

.hbar { display: grid; grid-template-columns: minmax(80px, 130px) minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 0 }
.hbar .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden }
.hbar .track span { display: block; height: 100%; border-radius: 5px }
.hbar .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.hbar .val { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px }

.tbl-wrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 13.5px }
th { text-align: left; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle }
th.n, td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums }
tbody tr:last-child td { border-bottom: 0 }
tfoot td { font-weight: 800; border-top: 2px solid var(--line); border-bottom: 0 }
tr.click { cursor: pointer }
tr.click:hover td { background: var(--surface-2) }
tr.detail td { background: var(--surface-2); padding: 14px }
tr.paid td { opacity: .62 }
tr.paid td:first-child, tr.paid td:last-child { opacity: 1 }
.rank { font: 700 15px var(--f-display); color: var(--muted); width: 28px }

.who { display: flex; align-items: center; gap: 9px; min-width: 0 }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 800 11px var(--f-body); color: #fff; flex: none }
.av.sm { width: 22px; height: 22px; font-size: 9.5px }
.who b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.who small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 800; white-space: nowrap }
.pill.good { background: var(--good-soft); color: var(--good) }
.pill.warn { background: var(--warn-soft); color: var(--warn) }
.pill.bad { background: var(--bad-soft); color: var(--bad) }
.pill.info { background: var(--info-soft); color: var(--info) }
.pill.mute { background: var(--surface-2); color: var(--muted) }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 5px; border-radius: 999px; background: var(--surface-2); font-size: 12.5px; font-weight: 600; white-space: nowrap }
.chip i { width: 10px; height: 10px; border-radius: 50%; flex: none }
.chip b { font-weight: 800; font-variant-numeric: tabular-nums }
.acct { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; white-space: nowrap }
.acct i { width: 10px; height: 10px; border-radius: 3px; flex: none }
.acct small { color: var(--muted); font-weight: 600 }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 9px; font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap }
.btn:hover { background: var(--surface-2) }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
.btn.primary:hover { filter: brightness(1.07) }
.btn.danger { color: var(--bad); border-color: var(--bad-soft) }
.btn.danger:hover { background: var(--bad-soft) }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted) }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg) }
.icon-btn { all: unset; cursor: pointer; width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 8px; color: var(--muted); flex: none }
.icon-btn:hover { background: var(--surface-2); color: var(--fg) }
.icon-btn:focus-visible { outline: 2px solid var(--accent) }
.icon-btn svg { width: 16px; height: 16px }

label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 800; color: var(--muted); min-width: 0 }
input[type=text], input[type=number], input[type=date], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; font-weight: 600; font-size: 14px }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent) }
textarea { resize: vertical; min-height: 60px }
.frow { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)) }
.frow .full { grid-column: 1 / -1 }
.check { display: inline-flex; gap: 7px; align-items: center; font-weight: 700; font-size: 13px; cursor: pointer }
.checks { display: flex; flex-wrap: wrap; gap: 6px }
.checks label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; font-weight: 700; cursor: pointer; background: var(--surface) }
.checks label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent) }
.checks input { margin: 0; accent-color: var(--accent) }

/* planning */
.pt-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface) }
.pt { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 900px }
.pt th, .pt td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 6px; vertical-align: top }
.pt th:last-child, .pt td:last-child { border-right: 0 }
.pt thead th { background: var(--surface); position: sticky; top: 0; text-align: center; padding: 10px 6px; font-size: 11px }
.pt thead th.today { color: var(--accent) }
.pt thead th b { display: block; font: 700 16px var(--f-display); color: var(--fg); letter-spacing: 0; text-transform: none }
.pt thead th.today b { color: var(--accent) }
.pt .rowh { position: sticky; left: 0; background: var(--surface); z-index: 1; width: 120px; min-width: 120px }
.pt .grp td { background: var(--surface-2); padding: 8px 10px; font-weight: 800 }
.pt .slot { font-size: 12px; font-weight: 800 }
.pt .slot small { display: block; color: var(--muted); font-weight: 600; font-size: 11px }
.cell { min-height: 38px; display: flex; flex-direction: column; gap: 4px; border-radius: 8px; padding: 3px; cursor: pointer; height: 100% }
.cell:hover { background: var(--surface-2) }
.cell .add { color: var(--muted); opacity: 0; font-weight: 800; font-size: 12px; text-align: center; padding: 6px 0; border: 1px dashed var(--line); border-radius: 7px }
.cell:hover .add, .cell:focus-visible .add { opacity: 1 }
.cell.empty .add { opacity: .55 }
.pc { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 7px; padding: 3px 7px 3px 4px; font-size: 12px; font-weight: 700; min-width: 0 }
.cell:hover .pc { background: var(--surface) }
.pc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pc.off { background: var(--bad-soft); color: var(--bad) }
.pc em { font-style: normal; margin-left: auto; width: 7px; height: 7px; border-radius: 50%; flex: none }
.offc { font-size: 11px; font-weight: 800; color: var(--bad); background: var(--bad-soft); border-radius: 6px; padding: 2px 6px; text-align: center }
.cov { font-size: 11px; color: var(--muted); text-align: center; font-weight: 700 }
.cov.full { color: var(--good) }
.byc { font-size: 12px; line-height: 1.35 }
.byc div { padding: 3px 6px; border-radius: 6px; background: var(--surface-2); margin-bottom: 3px }
.byc b { font-size: 11px; text-transform: uppercase; letter-spacing: .04em }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px }
.cal .dh { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; text-align: center; padding: 4px 0 }
.cal .d { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-height: 104px; padding: 7px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-width: 0 }
.cal .d:hover { border-color: var(--accent) }
.cal .d.out { opacity: .4 }
.cal .d.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
.cal .d .n { font: 700 15px var(--f-display) }
.cal .bar { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden }
.cal .bar span { display: block; height: 100%; background: var(--good) }
.cal .bar.part span { background: var(--warn) }
.cal .offs { display: flex; flex-wrap: wrap; gap: 3px }
.cal .offs span { font-size: 10.5px; font-weight: 800; background: var(--bad-soft); color: var(--bad); border-radius: 5px; padding: 1px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100% }
.cal .meta { font-size: 11px; color: var(--muted); font-weight: 700; margin-top: auto }

.quota { display: inline-flex; gap: 3px; vertical-align: middle }
.quota i { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line) }
.quota i.on { background: var(--accent); border-color: var(--accent) }
.quota i.over { background: var(--bad); border-color: var(--bad) }

/* pointage */
.att { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line) }
.att:last-child { border-bottom: 0 }
.att .accts { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0 }
.att .extra { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.att .extra input { width: auto; flex: 1 1 160px; padding: 6px 9px; font-size: 13px }
.att .extra input[type=number] { flex: 0 0 110px }
.stb { display: inline-flex; gap: 4px; flex-wrap: wrap }
.stb button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; border: 1px solid var(--line); color: var(--muted); background: var(--surface) }
.stb button:hover { border-color: var(--muted) }
.stb button:focus-visible { outline: 2px solid var(--accent) }
.stb button.on.present { background: var(--good-soft); color: var(--good); border-color: var(--good) }
.stb button.on.retard { background: var(--warn-soft); color: var(--warn); border-color: var(--warn) }
.stb button.on.coupure { background: var(--info-soft); color: var(--info); border-color: var(--info) }
.stb button.on.absent { background: var(--bad-soft); color: var(--bad); border-color: var(--bad) }
.slot-h { display: flex; align-items: baseline; gap: 10px; margin: 18px 0 2px; padding-bottom: 6px; border-bottom: 2px solid var(--line) }
.slot-h:first-child { margin-top: 0 }
.slot-h h3 { font-size: 15px }
.slot-h span { color: var(--muted); font-size: 12.5px; font-weight: 700 }

/* ventes */
.scards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; margin-top: 10px }
.sc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.sc.done { border-color: var(--good) }
.sc-h { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) 92px 78px 30px; gap: 6px; align-items: center }
.srow.head { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.money { position: relative }
.money input { padding: 6px 22px 6px 8px; text-align: right; font-size: 14px; font-variant-numeric: tabular-nums }
.money span { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 800; font-size: 12px; pointer-events: none }
.sc-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 12.5px; color: var(--muted) }
.sc-f b { color: var(--fg); font-variant-numeric: tabular-nums }
.saving { font-size: 12px; font-weight: 800; color: var(--muted) }
.saving.ok { color: var(--good) }

.paybox { all: unset; cursor: pointer; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; background: var(--surface) }
.paybox:focus-visible { outline: 2px solid var(--accent) }
.paybox.on { background: var(--good); border-color: var(--good); color: #fff }
.paybox svg { width: 14px; height: 14px }

.empty { text-align: center; padding: 36px 16px; color: var(--muted) }
.empty h3 { color: var(--fg); font-size: 18px; margin-bottom: 6px }
.empty p { max-width: 460px; margin: 0 auto 14px }
.empty .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap }

.overlay { position: fixed; inset: 0; background: rgba(15, 12, 20, .5); z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.modal { background: var(--surface); border-radius: 16px; width: min(640px, 100%); max-height: 100%; overflow: auto; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 14px }
.modal.sm { width: min(460px, 100%) }
.modal-h { display: flex; justify-content: space-between; align-items: center; gap: 10px }
.modal-h h2 { font-size: 19px }
.modal-f { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px }
.modal-f .left { margin-right: auto }
.arow { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px }
.arow-h { display: flex; gap: 8px; align-items: center }
.warnline { font-size: 12px; font-weight: 700; color: var(--bad) }
.infoline { font-size: 12px; font-weight: 700; color: var(--muted) }

.toast { position: fixed; bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px) }
.toast.err { background: var(--bad); color: #fff }

.muted { color: var(--muted) }
.right { text-align: right }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13.5px; margin: 0 }
.kv dt { color: var(--muted) }
.kv dd { margin: 0; font-weight: 700 }
.mnav { display: none }

@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)) } .g3 { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .side { display: none }
  .mnav { display: flex; gap: 4px; overflow-x: auto; padding-block: 12px 0 }
  .mnav button { all: unset; cursor: pointer; padding: 7px 12px; border-radius: 8px; font-weight: 800; font-size: 13px; color: var(--muted); white-space: nowrap }
  .mnav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent) }
  .g2, .g2e { grid-template-columns: minmax(0, 1fr) }
  .att { grid-template-columns: minmax(0, 1fr) }
  .cal .d { min-height: 76px; padding: 5px }
  .cal .offs span { font-size: 9.5px }
}
@media (max-width: 600px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .kpi .v { font-size: 20px }
  .topbar h1 { font-size: 20px }
  .frow { grid-template-columns: minmax(0, 1fr) }
  .scards { grid-template-columns: minmax(0, 1fr) }
  .cal { gap: 3px }
  .cal .meta { display: none }
}

/* v3 : planning, pointage et ventes épurés */
.fpills { display: flex; flex-wrap: wrap; gap: 6px }
.fp { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); background: var(--surface) }
.fp i { width: 8px; height: 8px; border-radius: 50% }
.fp:hover { color: var(--fg) }
.fp.on { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.fp:focus-visible { outline: 2px solid var(--accent) }
.wk-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface) }
.wk { border-collapse: collapse; width: 100%; min-width: 780px; table-layout: fixed }
.wk th, .wk td { border-bottom: 1px solid var(--line); padding: 0; vertical-align: top; text-align: left }
.wk td + td, .wk th + th { border-left: 1px solid var(--line) }
.wk tr:last-child td, .wk tr:last-child th { border-bottom: 0 }
.wk thead th { padding: 10px 10px 8px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--muted); font-size: 12px }
.wk thead .wd { text-transform: capitalize }
.wk thead .dn { display: block; font: 700 18px/1.1 var(--f-display); color: var(--fg) }
.wk thead th.today .dn, .wk thead th.today .wd { color: var(--accent) }
.wk .woff { display: block; margin-top: 3px; font-size: 11px; font-weight: 700; color: var(--bad); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.wk td.today { background: color-mix(in srgb, var(--accent-soft) 35%, transparent) }
.wk .wk-s { width: 78px; padding: 12px 10px; font-size: 13px; font-weight: 800; color: var(--fg); text-transform: none; letter-spacing: 0 }
.wk .wk-s small { display: block; font-size: 10.5px; font-weight: 600; color: var(--muted) }
.wc { display: flex; flex-direction: column; gap: 6px; padding: 9px 10px; min-height: 64px; height: 100%; cursor: pointer }
.wc:hover { background: var(--surface-2) }
.wc:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
.wp { display: flex; flex-direction: column; min-width: 0; line-height: 1.25 }
.nm { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; min-width: 0; white-space: nowrap }
.nm i { width: 8px; height: 8px; border-radius: 50%; flex: none }
.nm em { width: 6px; height: 6px; border-radius: 50% }
.st-present { background: var(--good) } .st-retard { background: var(--warn) } .st-coupure { background: var(--info) } .st-absent { background: var(--bad) }
.wp .ac, .ar .ac { font-size: 11.5px; color: var(--muted); padding-left: 14px; overflow-wrap: anywhere }
.wp.off .nm { color: var(--bad); text-decoration: line-through }
.wp.off .ac { color: var(--bad) }
.wc .add { color: var(--muted); opacity: .5; font-weight: 800 }
.miss { font-size: 11px; font-weight: 700; color: var(--warn); line-height: 1.3 }
.statbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; font-size: 13px }
.statbar .big { font: 700 18px var(--f-display); font-variant-numeric: tabular-nums }
.statbar .sep { width: 1px; height: 18px; background: var(--line) }
.card.flat { padding: 6px 18px 14px }
.lh { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 16px 0 6px; border-bottom: 1px solid var(--line) }
.lh span { text-transform: none; letter-spacing: 0; font-weight: 600; margin-left: 4px }
.ar { display: grid; grid-template-columns: minmax(110px, 160px) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line) }
.ar .ac { padding-left: 0 }
.ar .extra { grid-column: 1 / -1; display: flex; gap: 6px; padding-left: 14px }
.ar .extra input { padding: 5px 8px; font-size: 13px }
.ar .extra input[type=number] { width: 80px; flex: none }
.ar .stb button { padding: 4px 9px; font-size: 11.5px }
.sl { padding-top: 0 }
.sl-row { display: grid; grid-template-columns: minmax(110px, 1.1fr) minmax(130px, 1.3fr) 112px 96px 92px 34px; gap: 10px; align-items: center; padding: 5px 0 }
.sl-head { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 14px 0 0 }
.sl-head .r, .sl-row .r { text-align: right }
.sl-grp { border-bottom: 1px solid var(--line); padding: 4px 0 }
.sl-grp:last-child { border-bottom: 0 }
.sl-row .money input { padding: 6px 22px 6px 8px; background: var(--surface-2); border-color: transparent }
.sl-row .money input:focus { background: var(--surface); border-color: var(--accent) }
.sl-row.filled .money input { background: var(--surface); border-color: var(--line) }
.sl-row .pay { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 13px }
.sl-row.filled .pay { color: var(--good) }
.sl-row .acct { font-size: 13px; overflow: hidden; text-overflow: ellipsis }
.sl-row .icon-btn { width: 26px; height: 26px; font-weight: 800; font-size: 16px }
.sl-row .icon-btn svg { width: 13px; height: 13px }
.hb { background: var(--surface-2); border-radius: 12px; padding: 12px 14px }
.hb-t { font: 700 14px var(--f-display); margin-bottom: 8px }
.hb-sub { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 12px 0 6px }
.checks label small { font-weight: 600 }
@media (max-width: 700px) {
  .sl-head { display: none }
  .sl-row { grid-template-columns: minmax(0, 1fr) 96px 84px; row-gap: 4px }
  .sl-row .nm { grid-column: 1 / -1 }
  .sl-row .nm:empty { display: none }
  .sl-row .pay, .sl-row > span.r:last-of-type { display: none }
  .ar { grid-template-columns: minmax(0, 1fr) }
  .statbar .sep { display: none }
}

/* v4 : ventes par ligne, analyse */
.sx { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line) }
.sx-who { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 7px }
.sx-lines { display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.ln { grid-template-columns: 190px 118px 100px 84px 30px; justify-content: start; padding: 0 }
.ln .msel { padding: 5px 8px; font-size: 13px; font-weight: 700; min-width: 0 }
.ln .acct { padding-left: 2px; min-width: 0; overflow: hidden; text-overflow: ellipsis }
.ln .money input::placeholder { color: var(--muted); font-weight: 600; font-size: 12.5px }
.addln { all: unset; cursor: pointer; font-size: 12.5px; font-weight: 800; color: var(--accent); padding: 2px 0; align-self: flex-start }
.addln:hover { text-decoration: underline }
.addln:focus-visible { outline: 2px solid var(--accent) }
.checks label.all { border-style: dashed }
.prog { display: grid; grid-template-columns: minmax(70px, 110px) minmax(0, 1fr) 64px 92px; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px }
.prog .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.prog .track { position: relative; height: 10px; background: var(--surface-2); border-radius: 5px }
.prog .track > span { display: block; height: 100%; border-radius: 5px; background: var(--s1) }
.prog .track em { position: absolute; top: -3px; width: 2px; height: 16px; background: var(--fg); border-radius: 1px }
.prog .val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums }
.prog .dl { text-align: right }
.prog.me .name { color: var(--accent) }
.prog.me .track > span { background: var(--accent) }
.hm { border-collapse: separate; border-spacing: 3px; width: auto; min-width: 100% }
.hm th { padding: 2px; text-align: center; font-size: 10px; letter-spacing: 0; text-transform: capitalize; line-height: 1.2 }
.hm th.today { color: var(--accent) }
.hm td { padding: 0; border: 0 }
.hm .hm-n { font-weight: 700; font-size: 12.5px; white-space: nowrap; padding-right: 8px }
.hm tr.me .hm-n { color: var(--accent) }
.hm td.n { padding-left: 8px; font-size: 12.5px }
.hc { display: grid; place-items: center; min-width: 26px; height: 26px; border-radius: 5px; font-size: 10px; font-weight: 700; background: color-mix(in srgb, var(--s1) calc(var(--a) * 100%), var(--surface-2)); color: var(--fg) }
.hm-scale { display: inline-block; width: 70px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--surface-2), var(--s1)) }
@media (max-width: 700px) {
  .sx { grid-template-columns: minmax(0, 1fr); gap: 6px }
  .ln { grid-template-columns: minmax(0, 1fr) 1fr 30px; }
  .ln > :first-child { grid-column: 1 / -1 }
  .ln .pay { display: none }
  .prog { grid-template-columns: 80px minmax(0, 1fr) 56px }
  .prog .dl { display: none }
}


/* kit visuel partagé */
.tiles { display: grid; grid-template-columns: repeat(var(--tn, 5), minmax(0, 1fr)); gap: 12px; margin-bottom: 16px }
.tile { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; overflow: hidden }
.tile-h { display: flex; align-items: center; gap: 8px; min-width: 0 }
.tile-i { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)) }
.tile-i svg { width: 15px; height: 15px }
.tile-l { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tile-v { font: 700 24px/1.15 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tile-s { font-size: 12px; color: var(--muted) }
.tile .spark { position: absolute; right: 10px; bottom: 10px; opacity: .9 }
.tile.hl { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
.tile.hl .tile-l, .tile.hl .tile-s { color: var(--accent-fg); opacity: .85 }
.tile.hl .tile-i { color: var(--accent-fg); background: color-mix(in srgb, var(--accent-fg) 18%, transparent) }
.tile.hl .delta { color: var(--accent-fg) }
.pb { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .01em; white-space: nowrap; color: var(--fg); background: color-mix(in srgb, var(--c) 16%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent) }
.md { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; white-space: nowrap }
.md i { width: 8px; height: 8px; border-radius: 50%; flex: none }
@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
@media (max-width: 600px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)) } .tile-v { font-size: 20px } .tile .spark { display: none } }
/* v7 : pastille de créneau */
.slp { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 800; white-space: nowrap; color: var(--c); background: color-mix(in srgb, var(--c) 13%, var(--surface)); }
.lh .slp, tr.grp-row .slp { text-transform: none; letter-spacing: 0 }
.slp::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c) }
/* v6 : étiquettes plateforme, filtres */
tr.grp-row td { background: var(--surface-2); font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 6px 10px }
tr.inact td { opacity: .55 }
.at { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: var(--fg); white-space: nowrap; margin: 2px 6px 0 0 }
.at i { width: 7px; height: 7px; border-radius: 50%; flex: none }
.at b { font-size: 10.5px; font-weight: 800; padding: 1px 6px; border-radius: 999px; background: color-mix(in srgb, var(--pc) 18%, var(--surface)); color: var(--fg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pc) 45%, transparent) }
.wp .ac { display: flex; flex-wrap: wrap; white-space: normal; padding-left: 14px }
.fl { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); width: 74px; align-self: center }
.sx-done .nm { color: var(--good) }
.navstep:disabled { opacity: .35; cursor: default }

/* ---- plan.css ---- */
/* ===== Planning : utilitaires ===== */
.v-plan .pl-vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
.v-plan .tile-v small.pl-of { font-size: 15px; color: var(--muted); font-weight: 600 }

/* ===== barre d'outils ===== */
.v-plan .pl-bar { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px }
.v-plan .pl-bar-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between }
.v-plan .pl-view { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.v-plan .pl-ftog { display: none }
.v-plan .pl-ftog b { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-size: 11px }
.v-plan .pl-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.v-plan .pl-acts .btn svg { width: 14px; height: 14px; color: var(--muted) }
.v-plan .pl-acts .pl-danger:hover { color: var(--bad); background: var(--bad-soft) }
.v-plan .pl-filters { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; min-width: 0 }
.v-plan .pl-fr { display: flex; align-items: center; gap: 10px; min-width: 0 }
.v-plan .pl-fl { flex: none; width: 78px; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.v-plan .pl-fps { display: flex; flex-wrap: nowrap; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 2px 0 }
.v-plan .pl-fps::-webkit-scrollbar { display: none }
.v-plan .pl-fps.ovf { -webkit-mask-image: linear-gradient(to right, var(--fg) calc(100% - 36px), transparent); mask-image: linear-gradient(to right, var(--fg) calc(100% - 36px), transparent) }
.v-plan .pl-fp { all: unset; box-sizing: border-box; cursor: pointer; flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 4px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); background: var(--surface); white-space: nowrap; transition: background .12s, border-color .12s, color .12s }
.v-plan .pl-fp i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none }
.v-plan .pl-fp i.sq { border-radius: 2px }
.v-plan .pl-fp:hover { color: var(--fg); border-color: color-mix(in srgb, var(--c, var(--fg)) 45%, var(--line)) }
.v-plan .pl-fp.on { color: var(--fg); background: color-mix(in srgb, var(--c) 13%, var(--surface)); border-color: var(--c) }
.v-plan .pl-fp.all.on { background: var(--surface-2); border-color: var(--line); color: var(--fg) }
.v-plan .pl-fp:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
.v-plan .pl-fon { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12px; font-weight: 600; color: var(--muted) }
.v-plan .pl-clear { all: unset; cursor: pointer; font-weight: 800; color: var(--accent); padding: 4px 0 }
.v-plan .pl-clear:hover { text-decoration: underline }
.v-plan .pl-clear:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }

/* ===== semaine vide ===== */
.v-plan .pl-emptyc { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 14px; border-style: dashed; padding: 16px 18px }
.v-plan .pl-emptyi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--accent); background: var(--accent-soft) }
.v-plan .pl-emptyi svg { width: 20px; height: 20px }
.v-plan .pl-emptyt { flex: 1 1 260px; min-width: 0 }
.v-plan .pl-emptyt h3 { font-size: 16px; margin: 0 0 2px }
.v-plan .pl-emptyt p { margin: 0; color: var(--muted); font-size: 13px }
.v-plan .pl-emptya { display: flex; flex-wrap: wrap; gap: 8px }

/* ===== légende ===== */
.v-plan .pl-legend { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 18px; margin: 14px 2px 10px; font-size: 12px; color: var(--muted) }
.v-plan .pl-lg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px }
.v-plan .pl-lgs { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--fg) }
.v-plan .pl-lgs b { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--surface)) }
.v-plan .pl-lgs small { color: var(--muted); font-weight: 600; font-size: 11px }
.v-plan .pl-lgd { display: inline-flex; align-items: center; gap: 6px; font-weight: 600 }
.v-plan .pl-lgd .pl-stt { margin: 0 }
.v-plan .pl-lgx { display: inline-flex; align-items: center; font-weight: 700; font-size: 11px; padding: 1px 6px; border-radius: 4px; min-height: 18px; box-sizing: border-box }
.v-plan .pl-lgx svg { width: 12px; height: 12px }
.v-plan .pl-lgx.off { color: var(--bad); text-decoration: line-through; background: var(--bad-soft) }
.v-plan .pl-lgx.off.nostrike { text-decoration: none }
.v-plan .pl-lgx.gap { color: var(--warn); background: var(--warn-soft); outline: 1px dashed color-mix(in srgb, var(--warn) 60%, transparent); outline-offset: -1px }
.v-plan .pl-lgx.todo { color: var(--muted); outline: 1px dashed color-mix(in srgb, var(--muted) 55%, transparent); outline-offset: -1px; font-weight: 600 }
.v-plan .pl-legend .pl-inc { background: transparent; padding: 0 }
/* pastille d'incident de pointage (R / C / A) */
.v-plan .pl-stt { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; margin-left: 4px; vertical-align: 1px; font: 800 9px/1 var(--f-body); font-style: normal; color: var(--c); background: color-mix(in srgb, var(--c) 18%, var(--surface)); box-shadow: 0 0 0 1.5px var(--surface), inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent); flex: none; text-decoration: none }

/* ===== grille de la semaine ===== */
.v-plan .pl-scroll { overflow: auto; max-height: calc(100vh - 96px); border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overscroll-behavior-x: contain }
.v-plan .pl-wk { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1030px; table-layout: fixed; font-size: 12px }
.v-plan .pl-wk th, .v-plan .pl-wk td { padding: 0; border: 0; text-align: left; vertical-align: top; background-clip: padding-box }
.v-plan .pl-wk thead th { position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 9px 8px; text-transform: none; letter-spacing: 0; color: var(--fg); font-size: 12px; font-weight: 600; white-space: normal }
.v-plan .pl-wk thead th + th, .v-plan .pl-wk tbody td + td { border-left: 1px solid var(--line) }
.v-plan .pl-wk .pl-corner { width: 150px; left: 0; z-index: 4; vertical-align: bottom; border-right: 1px solid var(--line) }
.v-plan .pl-corner span { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.v-plan .pl-dh.today { background: color-mix(in srgb, var(--accent) 7%, var(--surface)); box-shadow: inset 0 3px 0 var(--accent) }
.v-plan .pl-dh-t { display: flex; align-items: baseline; gap: 6px; min-height: 22px }
.v-plan .pl-wd { text-transform: capitalize; color: var(--muted); font-weight: 700; font-size: 12px }
.v-plan .pl-dn { font: 700 19px/1 var(--f-display); font-variant-numeric: tabular-nums }
.v-plan .pl-dh.past .pl-dn { color: var(--muted) }
.v-plan .pl-dh.today .pl-wd, .v-plan .pl-dh.today .pl-dn { color: var(--accent) }
.v-plan .pl-cov { display: flex; align-items: center; gap: 7px; margin-top: 7px; white-space: nowrap }
.v-plan .pl-cov4 { display: inline-flex; gap: 2px; flex: none }
.v-plan .pl-cov4 i { width: 14px; height: 6px; border-radius: 2px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line) }
.v-plan .pl-cov4 i.idle { background: transparent; box-shadow: inset 0 0 0 1px var(--line); opacity: .5 }
.v-plan .pl-cov4 i.full { background: var(--c); box-shadow: none }
.v-plan .pl-cov4 i.part { background: repeating-linear-gradient(-45deg, var(--c) 0 2px, color-mix(in srgb, var(--c) 22%, var(--surface)) 2px 4px); box-shadow: none }
.v-plan .pl-covn { font-size: 11px; font-weight: 800; color: var(--warn); font-variant-numeric: tabular-nums; white-space: nowrap }
.v-plan .pl-covn.ok { color: var(--good) }
.v-plan .pl-doff { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; min-height: 17px }
.v-plan .pl-doff span:not(.pl-vh) { font-size: 10.5px; font-weight: 800; line-height: 15px; background: var(--bad-soft); color: var(--bad); border-radius: 5px; padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100% }
.v-plan .pl-doff .more { background: var(--surface-2); color: var(--muted) }

/* groupes (modèle / shift) */
.v-plan .pl-g td { background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 0 }
.v-plan .pl-g .pill.mute { background: var(--surface) }
.v-plan .pl-gh { all: unset; box-sizing: border-box; position: sticky; left: 0; display: inline-flex; align-items: center; gap: 9px; padding: 8px 12px; min-height: 38px; font-size: 13px; cursor: pointer; max-width: 100vw }
.v-plan .pl-gh.static { cursor: default }
.v-plan .pl-gh b { font: 700 14.5px var(--f-display) }
.v-plan .pl-gh:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px }
.v-plan .pl-gh:hover .pl-chev { color: var(--fg) }
.v-plan .pl-chev { width: 14px; height: 14px; color: var(--muted); transition: transform .15s; flex: none }
.v-plan .pl-gh[aria-expanded="false"] .pl-chev { transform: rotate(-90deg) }
.v-plan .pl-mdot { width: 11px; height: 11px; border-radius: 50%; background: var(--m); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--m) 20%, transparent) }
.v-plan .pl-gn { color: var(--muted); font-size: 12px; font-weight: 600 }
.v-plan .pl-gl { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }

/* colonne collante : modèle + plateforme + état de la semaine */
.v-plan .pl-r th, .v-plan .pl-r td { border-bottom: 1px solid var(--line) }
.v-plan .pl-r:last-child th, .v-plan .pl-r:last-child td { border-bottom: 0 }
.v-plan .pl-wk .pl-acc { position: sticky; left: 0; z-index: 2; background: var(--surface); padding: 8px 10px 8px 13px; border-right: 1px solid var(--line); box-shadow: inset 3px 0 0 var(--m, transparent); text-transform: none; letter-spacing: 0; color: var(--fg); font-weight: 600 }
.v-plan .pl-acc-m { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12.5px; font-weight: 800 }
.v-plan .pl-acc-m i { width: 8px; height: 8px; border-radius: 50%; background: var(--m); flex: none }
.v-plan .pl-acc-m span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.v-plan .pl-acc-in { display: flex; align-items: center; gap: 5px; margin-top: 5px; min-width: 0 }
.v-plan .pl-acc .pb { font-size: 11px; padding: 1px 7px; min-width: 0; overflow: hidden; text-overflow: ellipsis }
.v-plan .pl-cur { font-size: 10.5px; font-weight: 800; color: var(--muted); width: 17px; height: 17px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--surface-2); flex: none }
.v-plan .pl-acc-s { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 11px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums }
.v-plan .pl-acc-s.w { color: var(--warn) }
.v-plan .pl-acc-s svg { width: 12px; height: 12px; color: var(--good) }
.v-plan .pl-wk td.today { background: color-mix(in srgb, var(--accent) 4%, var(--surface)) }
.v-plan .pl-cell { display: flex; flex-direction: column; gap: 2px; padding: 5px }
.v-plan .pl-wk td.past .pl-cell, .v-plan .pl-wk td.past .pl-cc { opacity: .72 }

/* une ligne = un créneau */
.v-plan .pl-ln { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 6px; width: 100%; min-width: 0; min-height: 22px; padding-right: 6px; border-radius: 5px; cursor: pointer; font-size: 12px; transition: box-shadow .12s, background .12s }
.v-plan .pl-ln > b { flex: none; align-self: stretch; width: 17px; min-height: 22px; display: grid; place-items: center; border-radius: 5px 0 0 5px; font-size: 10px; font-weight: 800; color: var(--c); background: color-mix(in srgb, var(--c) 18%, var(--surface)) }
.v-plan .pl-ln.on { background: color-mix(in srgb, var(--c) 7%, var(--surface)) }
.v-plan .pl-ln.on > b { background: color-mix(in srgb, var(--c) 82%, var(--fg)); color: var(--surface) }
.v-plan .pl-names { min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; white-space: normal; line-height: 15px; padding-block: 3px; font-weight: 700; color: var(--fg) }
.v-plan .pl-n { white-space: nowrap }
.v-plan .pl-n.off { color: var(--bad); text-decoration: line-through }
.v-plan .pl-n.ina { color: var(--muted); font-weight: 600 }
.v-plan .pl-n .pl-stt { width: 14px; height: 14px; font-size: 8.5px; margin-left: 3px; vertical-align: 0 }
.v-plan .pl-sep { color: var(--muted) }
.v-plan .pl-ln.offall { background: var(--bad-soft) }
.v-plan .pl-ln.gap { background: color-mix(in srgb, var(--warn-soft) 70%, var(--surface)); outline: 1px dashed color-mix(in srgb, var(--warn) 55%, transparent); outline-offset: -1px }

/* créneau que personne ne tient cette semaine : presque invisible */

.v-plan .pl-ln:focus-visible { outline: 2px solid var(--accent); outline-offset: 0 }

/* vue par chatteur */
.v-plan .pl-wkc .pl-corner { width: 160px }
.v-plan .pl-wk .pl-who { padding: 9px 10px; font-size: 13.5px }
.v-plan .pl-who .who { gap: 8px }

.v-plan .pl-r.ina { opacity: .6 }
.v-plan .pl-cc { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 5px; min-height: 52px; height: 100% }

.v-plan .pl-sh.off { opacity: .65 }
.v-plan .pl-sh.off .pl-sht, .v-plan .pl-sh.off .pl-agn { text-decoration: line-through }
.v-plan .pl-sht { font-size: 11px; font-weight: 800; color: var(--c) }
.v-plan .pl-shacc { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px; min-width: 0 }
.v-plan .pl-sh { position: relative }
.v-plan .pl-sh.has-st { padding-right: 22px }
.v-plan .pl-sh > .pl-stt { position: absolute; top: 5px; right: 5px; margin: 0 }
.v-plan .pl-offc { display: flex; align-items: center; justify-content: center; padding: 4px 6px; border-radius: 6px; background: var(--bad-soft); color: var(--bad); font-size: 11px; font-weight: 800 }
.v-plan .pl-add { all: unset; box-sizing: border-box; cursor: pointer; flex: 1; min-height: 40px; display: grid; place-items: center; border: 1px dashed var(--line); border-radius: 7px; color: var(--muted); font-weight: 800; opacity: .45 }
.v-plan .pl-add.mini { position: absolute; bottom: 6px; right: 6px; width: 22px; height: 22px; min-height: 0; flex: none; border-radius: 50%; font-size: 13px; line-height: 1; background: var(--surface); opacity: 0 }
.v-plan .pl-cc:hover .pl-add, .v-plan .pl-add:focus-visible { opacity: 1; border-color: var(--muted); color: var(--fg) }
.v-plan .pl-add:focus-visible { outline: 2px solid var(--accent) }
.v-plan .pl-gs .pl-gh { gap: 10px }

/* comptes groupés par modèle (grilles, pointage, day off, fenêtre) */
.v-plan .pl-ag, .pl-modal .pl-ag { display: inline-flex; align-items: flex-start; gap: 4px; font-size: 11px; line-height: 15px; font-weight: 700; color: var(--fg); min-width: 0; max-width: 100% }
.v-plan .pl-ag > i, .pl-modal .pl-ag > i { width: 7px; height: 7px; border-radius: 50%; flex: none; margin-top: 4px }

.v-plan .pl-ab { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--fg); white-space: nowrap; max-width: 100% }

.v-plan .pl-ab b { font-size: 10px; font-weight: 800; padding: 0 5px; border-radius: 4px; background: color-mix(in srgb, var(--c) 16%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent); overflow: hidden; text-overflow: ellipsis }

/* ===== mois ===== */
.v-plan .pl-calcard { padding: 14px }
.v-plan .pl-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px }
.v-plan .pl-dw { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; text-align: center; padding: 0 0 4px }
.v-plan .pl-d { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; min-height: 112px; padding: 8px 9px; display: flex; flex-direction: column; gap: 7px; cursor: pointer; min-width: 0; overflow: hidden; transition: border-color .12s, box-shadow .12s }

.v-plan .pl-d.out { opacity: .38 }

.v-plan .pl-d-h { display: flex; align-items: center; justify-content: space-between; gap: 4px; min-height: 22px }
.v-plan .pl-d-n { font: 700 16px/1 var(--f-display); font-variant-numeric: tabular-nums }

.v-plan .pl-inc { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; color: var(--c); border-radius: 999px; padding: 1px 4px; white-space: nowrap; font-variant-numeric: tabular-nums }
.v-plan .pl-inc svg { width: 11px; height: 11px; flex: none }

.v-plan .pl-cov4.lg { display: flex; gap: 3px }

.v-plan .pl-d-meta { font-size: 11px; color: var(--muted); font-weight: 700 }

.v-plan .pl-ol { display: flex; flex-direction: column }

.v-plan .pl-date { width: 48px; text-align: center; border-radius: 10px; background: var(--surface-2); padding: 5px 0 6px; line-height: 1.1 }

.v-plan .pl-or-sh { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.v-plan .pl-or-l { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 8px }
.v-plan .pl-ok { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--muted) }
.v-plan .pl-ok svg { width: 13px; height: 13px; color: var(--good) }
.v-plan .pl-or-act { display: flex; gap: 4px; align-items: center; justify-content: flex-end }
.v-plan .pl-todo { align-items: center; flex-wrap: wrap; margin-bottom: 8px }

.v-plan .pl-offgrid { align-items: start }

.v-plan .pl-quota { display: flex; flex-direction: column }

.v-plan .pl-dots { display: inline-flex; gap: 4px }

.v-plan .pl-dots i.over { background: var(--bad); box-shadow: none }
.v-plan .pl-qn { text-align: right; font-size: 13px; color: var(--muted) }

.v-plan .pl-qn.warn { color: var(--warn) }

.v-plan .pl-more { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; text-align: center; padding: 7px; margin-bottom: 4px; border-radius: 8px; background: var(--surface-2); font-size: 12.5px; font-weight: 700; color: var(--muted) }

/* messages (communs vue + fenêtre) */

.v-plan .pl-msg.info, .pl-modal .pl-msg.info { background: var(--info-soft) }

.pl-modal .pl-msg.good { background: var(--good-soft) }
.pl-modal .pl-msg.good > svg { color: var(--good) }
.v-plan .pl-msg .slp, .pl-modal .pl-msg .slp { vertical-align: 1px }

/* ===== pointage ===== */
.v-plan .pl-attbar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-bottom: 16px }

.v-plan .pl-attnum small { font-size: 16px; color: var(--muted) }
.v-plan .pl-attnum span { font-size: 12px; color: var(--muted); font-weight: 600 }
.v-plan .pl-attmid { flex: 1 1 260px; display: flex; flex-direction: column; gap: 9px; min-width: 0 }

.v-plan .pl-attc { padding: 4px 18px 14px }
.v-plan .pl-ash { display: flex; align-items: center; gap: 10px; padding: 14px 0 8px; border-bottom: 2px solid color-mix(in srgb, var(--c) 30%, var(--line)) }
.v-plan .pl-ash-h { color: var(--muted); font-size: 12.5px; font-weight: 700 }
.v-plan .pl-ash-n { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 700 }
.v-plan .ar.pl-ar { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; padding: 10px 0 10px 14px; box-shadow: inset 3px 0 0 var(--sc) }

.v-plan .pl-stb { display: inline-flex; flex-wrap: wrap; gap: 4px }
.v-plan .pl-stb button { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; border: 1px solid var(--line); color: var(--muted); background: var(--surface); transition: border-color .12s, background .12s }

.v-plan .pl-stb button.on i { opacity: 1 }
.v-plan .pl-stb button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.v-plan .ar .pl-extra { grid-column: 1 / -1; display: flex; gap: 6px; padding-left: 0 }
.v-plan .pl-extra input[type=text] { flex: 1 1 160px; padding: 6px 9px; font-size: 13px }
.v-plan .pl-min { position: relative; flex: none; width: 96px }
.v-plan .pl-ar .pl-min input[type=number] { width: 100%; padding: 6px 36px 6px 9px; font-size: 13px; text-align: right }
.v-plan .pl-min span { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 700; color: var(--muted); pointer-events: none }
.v-plan .pl-offl { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 2px }

.v-plan .pl-sum th:last-child, .v-plan .pl-sum td:last-child { padding-right: 0 }
.v-plan .pl-sn { display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: 120px }

.v-plan .pl-pres { display: flex; align-items: center; gap: 6px }

.v-plan .pl-rate { white-space: nowrap; font-size: 11.5px; font-weight: 700; color: var(--muted) }

.pl-modal .pl-msg-l { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px }

/* en-tête de quinzaine */

.v-pay .pay-cb { display: grid; place-items: center }
.v-pay .pay-box { all: unset; box-sizing: border-box; cursor: pointer; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface); border: 2px solid color-mix(in srgb, var(--fg) 22%, var(--surface)); color: var(--good); transition: background .18s, border-color .18s, transform .1s }

/* ===== v57 : pleine largeur, menu groupé, boutons glissants ===== */
.inner { max-width: 1280px }
.app { grid-template-columns: 236px minmax(0, 1fr) }
.side { padding: 20px 12px 16px; gap: 18px; overflow-y: auto; scrollbar-width: thin }
.nav { gap: 2px }

.nav button > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

.nav-foot:empty { display: none }
.topbar h1 { font-size: 26px }
/* segments : la pastille glisse d'un choix à l'autre */
.seg { position: relative; isolation: isolate; padding: 3px; border-radius: 10px }
.seg button { position: relative; z-index: 1; transition: color .2s; padding: 6px 12px; border-radius: 8px }
.seg.slid::before { content: ""; position: absolute; z-index: 0; left: var(--sx, 0); top: var(--sy, 3px); width: var(--sw, 0); height: var(--sh, 0); border-radius: 8px; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.12); transition: left .32s cubic-bezier(.3,.8,.25,1), top .32s cubic-bezier(.3,.8,.25,1), width .32s cubic-bezier(.3,.8,.25,1), height .32s; pointer-events: none }

.seg.acc.slid::before { background: var(--accent) }

.ra-bar { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 14px; margin-bottom: 14px; background: color-mix(in srgb, var(--s7) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--s7) 35%, var(--line)) }

}
/* fenêtre d'import */

.imp-msg { padding: 11px 14px; border-radius: 11px; font-size: 13.5px; font-weight: 600; background: var(--info-soft); border-left: 3px solid var(--info); line-height: 1.5 }

.imp-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto }

.imp-h { align-items: center }
.imp-tbl { max-height: 440px }
.imp-tbl table { font-size: 13px }
.imp-tbl th, .imp-tbl td { padding: 8px 10px }
.imp-ras { display: flex; flex-direction: column; gap: 8px }

.imp-ra small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px }
.imp-ra input { width: 17px; height: 17px; accent-color: var(--s7); margin: 2px 0 0 }
.imp-ra-i { width: 18px; height: 18px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 900; color: var(--warn); background: var(--warn-soft); margin-top: 1px }
.imp-modal .modal-f { position: sticky; bottom: 0; z-index: 2; background: var(--surface); margin: 0 -28px; padding: 14px 28px 20px; border-top: 1px solid var(--line) }

@media (max-width: 760px) { .modal.imp-modal { padding: 18px 16px 0 } .imp-modal .modal-f { margin: 0 -16px; padding: 12px 16px 16px } .imp-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) } }

.v-plan .pl-mk-l span { display: inline-flex; align-items: baseline; gap: 5px; padding: 5px 10px; border-radius: 10px; background: color-mix(in srgb, var(--c) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 25%, var(--line)); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap }
.v-plan .pl-mk-l b { font: 800 15px var(--f-display); color: var(--c) }
.v-plan .pl-mk-l span.zero { opacity: .55 }
.v-plan .pl-attgrid { grid-template-columns: minmax(0, 1fr) }
.v-plan .ar.pl-ar { padding: 6px 0 6px 14px; gap: 6px 14px }
.v-plan .pl-ar-who { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 14px }
.v-plan .pl-ar-top { display: contents }
.v-plan .pl-ar-top .who { flex: none; width: 210px; max-width: none; order: 0 }
.v-plan .pl-ar-who .pl-ar-acc { order: 1; padding-left: 0; flex: none; min-width: 210px; gap: 4px 14px }

.v-plan .pl-ar-acc .pl-pb { font-size: 11px; line-height: 18px; padding: 0 6px }
.v-plan .pl-ar-acc .pl-agc { margin-top: 0 }
.v-plan .pl-ar-top .pl-bxs { order: 2 }
.v-plan .pl-ar-who .pl-ar-cut { order: 3; flex-basis: 100%; padding-left: 35px }
.v-plan .pl-stb button { min-height: 30px; padding: 3px 12px }

.v-plan .pl-sumc { scroll-margin-top: 16px }

.v-plan .pl-sum .pl-sn { max-width: 220px; gap: 9px }

.v-plan .pl-sum .pl-pres { gap: 10px }
.v-plan .pl-sum .pl-mbar { width: min(260px, 22vw); height: 10px; border-radius: 5px }

/* ===== v58 : style inspiré de Wysper =====
   noir neutre (plus de bleu nuit), bleu pour la navigation et les choix, vert gardé pour l'argent (CA net, reste à payer) */
:root {
  --bg: #F6F6F8; --surface: #FFFFFF; --surface-2: #F0F0F3; --line: #E4E4EA;
  --fg: #111116; --muted: #6A6A76; --accent: #3560D9; --accent-fg: #FFFFFF; --accent-soft: #E8EEFC;
  --info: #3560D9; --info-soft: #E8EEFC;
  --money: #1F8F5F; --money-fg: #FFFFFF; --money-2: #2AA571;
  --side: #FBFBFC; --seg-bg: #EDEDF1; --seg-pill: #FFFFFF; --seg-ring: #18181F;
  --nav-on: linear-gradient(90deg, #E3EAFD, #F2F5FE 85%); --nav-on-line: #C9D6F8; --nav-on-ic: #3560D9;
  --bp1: #4672E8; --bp2: #2E58CF;
  --ctl: #FFFFFF; --ctl-line: #DADAE2; --ring: 0 0 0 3px rgba(53, 96, 217, .18);
  --shadow: 0 1px 2px rgba(17, 17, 22, .04), 0 4px 16px rgba(17, 17, 22, .05);
  --f-display: "Geist", "Segoe UI", system-ui, sans-serif;
  --f-body: "Geist", "Segoe UI", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  --bg: #0C0C0F; --surface: #131317; --surface-2: #1B1B21; --line: #24242B;
  --fg: #F3F3F6; --muted: #8D8D99; --accent: #5B83F0; --accent-fg: #FFFFFF; --accent-soft: #18213A;
  --good: #4CC992; --good-soft: #10261C; --warn: #E8AE52; --warn-soft: #2A2214; --bad: #F27A66; --bad-soft: #2E1716; --info: #7FA0F2; --info-soft: #161E33;
  --money: #4FBF8F; --money-fg: #05140D; --money-2: #3FA87B;
  --side: #0F0F12; --seg-bg: #1A1B22; --seg-pill: #2A2B34; --seg-ring: rgba(255, 255, 255, .86);
  --nav-on: linear-gradient(90deg, #1F2E54, #171A26 88%); --nav-on-line: #2C3D6E; --nav-on-ic: #7C9BF2;
  --bp1: #5A82F1; --bp2: #3B62D8;
  --ctl: #16161B; --ctl-line: #2A2A32; --ring: 0 0 0 3px rgba(91, 131, 240, .22);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .25);
}
body { font-feature-settings: "ss01", "cv11"; letter-spacing: -.003em }
h1, h2, h3 { letter-spacing: -.02em; font-weight: 700 }
::selection { background: color-mix(in srgb, var(--accent) 35%, transparent) }
* { scrollbar-color: color-mix(in srgb, var(--muted) 35%, transparent) transparent }

/* --- menu de gauche --- */
.side { background: var(--side); border-right: 1px solid var(--line); padding: 18px 12px 14px; gap: 14px }
.brand { padding: 4px 8px 10px; border-bottom: 1px solid var(--line); margin: 0 -12px; padding-inline: 20px; padding-bottom: 16px }
.brand b { font: 700 17px var(--f-display); letter-spacing: -.02em }
.nav { gap: 3px }
.nav svg { stroke-width: 1.7 }
.nav button, .nav .ngh { padding: 9px 12px; border-radius: 11px; font-weight: 500; font-size: 14px; color: color-mix(in srgb, var(--fg) 72%, var(--muted)); border: 1px solid transparent }
.nav button:hover, .nav .ngh:hover { background: var(--surface-2); color: var(--fg) }
.nav button[aria-current="page"], .nav button.nsub[aria-current="page"] { background: var(--nav-on); border-color: var(--nav-on-line); color: var(--fg); font-weight: 600; box-shadow: none }
.nav button[aria-current="page"] svg { color: var(--nav-on-ic) }
.nav button.nsub[aria-current="page"]::before { border-left: 1.5px solid var(--line) }
.nav > button + .ngrp { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line) }
.nav .ngrp { margin-top: 4px }
.nav .ngh { font-weight: 500 }
.nav .ngrp.here .ngh { color: var(--fg) }
.nav .ngh .ngc { width: 15px; height: 15px; opacity: .6; transform: rotate(90deg) }
.nav .ngrp.open .ngh .ngc { transform: rotate(-90deg) }
.nav button.nsub { margin-left: 22px; padding: 7px 11px; font-size: 13.5px }
.nav button.nsub::before { left: -11px; border-left: 1.5px solid var(--line) }
.side-foot { border-top: 1px solid var(--line); margin: auto -12px 0; padding: 12px 20px 0; gap: 8px }
.thm { background: var(--seg-bg); border-radius: 11px; padding: 3px }
.thm button { font-weight: 500; border-radius: 8px; padding: 5px 11px }
.thm button[aria-pressed="true"] { background: var(--seg-pill); color: var(--fg); font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--seg-ring) }

/* --- haut de page --- */
.topbar { padding-block: 18px 14px; border-bottom: 1px solid var(--line) }
.topbar h1 { font-size: 26px; font-weight: 700; letter-spacing: -.03em }
.topbar .sub { font-size: 13px }
.mnav button[aria-current="page"] { background: var(--nav-on); color: var(--fg); box-shadow: inset 0 0 0 1px var(--nav-on-line) }

/* --- boutons à choix : la pastille cerclée de blanc --- */
.seg { background: var(--seg-bg); border-radius: 12px; padding: 4px; gap: 2px }
.seg button { font-weight: 500; color: var(--muted); padding: 6px 13px; border-radius: 9px; font-size: 13px }
.seg button:hover { color: var(--fg) }
.seg button[aria-pressed="true"] { background: var(--seg-pill); color: var(--fg); font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--seg-ring) }
.seg.slid::before, :root[data-theme="dark"] .seg.slid::before { background: var(--seg-pill); border-radius: 9px; box-shadow: inset 0 0 0 1.5px var(--seg-ring), 0 2px 8px rgba(0, 0, 0, .18) }
.seg.slid button[aria-pressed="true"] { background: transparent; box-shadow: none }
.seg.acc.slid::before { background: var(--seg-pill) }
.seg.acc.slid button[aria-pressed="true"] { color: var(--fg) }

/* --- boutons --- */
.btn { border-radius: 11px; font-weight: 600; background: var(--surface-2); border-color: var(--line); padding: 8px 14px; transition: background .15s, border-color .15s, box-shadow .15s }
.btn:hover { background: color-mix(in srgb, var(--surface-2) 70%, var(--fg) 6%); border-color: color-mix(in srgb, var(--line) 60%, var(--muted)) }
.btn.primary { background: linear-gradient(180deg, var(--bp1), var(--bp2)); border-color: var(--bp2); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 1px 2px rgba(0, 0, 0, .25) }
.btn.primary:hover { filter: brightness(1.08) }
.btn.sm { border-radius: 9px }
.btn.ghost { background: transparent; border-color: transparent }
.btn.ghost:hover { background: var(--surface-2) }
.btn.danger { background: transparent; border-color: color-mix(in srgb, var(--bad) 35%, var(--line)) }
.navstep { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; min-width: 32px; height: 32px }
.navstep:hover { background: var(--surface); border-color: color-mix(in srgb, var(--line) 50%, var(--muted)) }
.icon-btn { border-radius: 9px }

/* --- champs --- */
input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], input[type=search], select, textarea { background: var(--ctl); border: 1px solid var(--ctl-line); border-radius: 10px; font-weight: 500 }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring) }
.msel > summary { background: var(--surface-2); border-color: var(--line); border-radius: 11px; font-weight: 600 }
.msel.on > summary { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); color: var(--fg) }
:focus-visible { outline-color: var(--accent) }

/* --- cartes, tuiles --- */
.card, .tile, .kpi { border-radius: 16px; border-color: var(--line); box-shadow: none }
.card h2 { font-size: 16px; font-weight: 650; letter-spacing: -.015em }
.tile-l, .kpi .l, th { font-weight: 600; letter-spacing: .06em }
.tile-v, .kpi .v { font-weight: 700; letter-spacing: -.025em }
.tile-i { border-radius: 9px }
.tile.hl, .kpi.hl { --accent: var(--money); --accent-fg: var(--money-fg); background: linear-gradient(150deg, var(--money-2), var(--money)); border-color: var(--money) }
.banner { border-radius: 12px; border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent) }
.overlay { background: rgba(5, 5, 8, .62); backdrop-filter: blur(3px) }
.modal { border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 24px 70px rgba(0, 0, 0, .45) }
.toast { border-radius: 12px }
.pill, .chip { font-weight: 600 }
.fp { font-weight: 500 }
.fp.on { background: var(--seg-pill); color: var(--fg); border-color: var(--seg-ring) }
table th { color: var(--muted) }
tr.click:hover td { background: color-mix(in srgb, var(--surface-2) 70%, transparent) }
.stb button { border-radius: 9px; font-weight: 600 }
.checks label { border-radius: 10px; font-weight: 600 }
.checks label:has(input:checked) { color: var(--fg) }

:root[data-theme="dark"] {
  --bg: #0B0B0E; --surface: #121216; --surface-2: #1A1A1F; --line: #222229;
  --side: #0F0F13; --ctl: #17171C; --ctl-line: #28282F; --seg-bg: #15151A; --seg-pill: #2A2A31;
  --accent: #3D6DF5; --bp1: #4A79FA; --bp2: #3463EE; --accent-soft: #172036;
}
:root { --seg-pill-l: #FFFFFF }

/* menu : panneau flottant aux coins arrondis */
@media (min-width: 901px) {
  .app { grid-template-columns: 266px minmax(0, 1fr) }
  .side { margin: 14px 0 14px 14px; height: calc(100vh - 28px); top: 14px; border: 1px solid var(--line); border-radius: 22px; padding: 14px 12px 12px; gap: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, .18) }
  .main { padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)) }
}
.brand { margin: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface-2) }
.brand .logo { width: 40px; height: 32px; border-radius: 9px }
.brand b { font-size: 16px }
.side-foot { margin: auto 0 0; padding: 12px 6px 2px }
.nav button, .nav .ngh { font-size: 14.5px; padding: 10px 12px; border-radius: 12px }
.nav button[aria-current="page"], .nav button.nsub[aria-current="page"] { box-shadow: 0 6px 20px -10px rgba(61, 109, 245, .55) }

/* haut de page : grand titre, pas de trait, barre collante floutée */
.topbar { border-bottom: 0; padding-block: 24px 14px; margin-bottom: 10px; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px) }
.topbar h1 { font-size: 32px; letter-spacing: -.035em }
@media (max-width: 600px) { .topbar h1 { font-size: 24px } }

/* boutons à choix : pastille pleine partout, cerclée de blanc seulement pour la période en haut de page */
.seg { border: 1px solid var(--line) }
.seg button[aria-pressed="true"] { box-shadow: none }
.seg.slid::before, :root[data-theme="dark"] .seg.slid::before { box-shadow: 0 1px 3px rgba(0, 0, 0, .25) }
:root:not([data-theme="dark"]) .seg.slid::before { background: var(--seg-pill-l); box-shadow: 0 1px 3px rgba(17, 17, 22, .12) }
.topbar .seg button[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--seg-ring) }
.topbar .seg.slid button[aria-pressed="true"] { box-shadow: none }
.topbar .seg.slid::before, :root[data-theme="dark"] .topbar .seg.slid::before { box-shadow: inset 0 0 0 1.5px var(--seg-ring), 0 2px 10px rgba(0, 0, 0, .25) }

/* boutons */
.btn { border-radius: 12px; padding: 9px 16px; background: var(--surface-2); border-color: var(--ctl-line) }
.btn.sm { border-radius: 10px; padding: 6px 12px }
.btn.primary { background: linear-gradient(180deg, var(--bp1), var(--bp2)); border-color: transparent; box-shadow: 0 8px 22px -10px color-mix(in srgb, var(--accent) 85%, transparent), inset 0 1px 0 rgba(255, 255, 255, .16) }
.navstep { border-radius: 11px; min-width: 36px; height: 36px; background: var(--surface-2); border-color: var(--ctl-line) }
input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], input[type=search], select, textarea { border-radius: 12px }
.msel > summary { border-radius: 12px; height: 38px }

/* cartes : grands arrondis, halo de couleur dans le coin */
.card { border-radius: 22px; padding: 22px }
.card h2 { font-size: 19px; letter-spacing: -.025em }
.tiles { gap: 14px }
.tile { border-radius: 20px; padding: 18px 20px 16px; gap: 6px; background: radial-gradient(120% 130% at 100% 0%, color-mix(in srgb, var(--c) 15%, transparent), transparent 58%), var(--surface) }
.tile-i { width: 30px; height: 30px; border-radius: 10px }
.tile-l { text-transform: none; letter-spacing: 0; font-size: 13.5px; font-weight: 500 }
.tile-v { font-size: 30px; letter-spacing: -.035em }
.tile::after { content: none; position: absolute; top: 12px; right: 14px; width: 76px; height: 76px; background: var(--ill) center / contain no-repeat; transform: rotate(-7deg); filter: drop-shadow(0 10px 18px color-mix(in srgb, var(--c) 45%, transparent)); pointer-events: none }
.tile.hl { --c: var(--money); --accent: var(--money); --accent-fg: var(--money); color: var(--fg); background: radial-gradient(110% 140% at 90% -10%, color-mix(in srgb, var(--money) 38%, transparent), transparent 62%), linear-gradient(180deg, color-mix(in srgb, var(--money) 9%, var(--surface)), var(--surface)); border-color: color-mix(in srgb, var(--money) 45%, var(--line)) }
.tile.hl .tile-l { opacity: 1 }
.tile.hl .tile-s { color: color-mix(in srgb, var(--money) 55%, var(--fg)); opacity: 1 }
.tile.hl .tile-i { color: var(--money); background: color-mix(in srgb, var(--money) 16%, transparent) }
.v-dash .tile.hl .dash-vs { color: color-mix(in srgb, var(--money) 55%, var(--fg)) }
.v-pay .tile.hl .tile-v .pay-eq { color: color-mix(in srgb, var(--money) 60%, var(--fg)) }
/* tableau de bord : une illustration par tuile */
.v-dash .tiles.t3 .tile { min-height: 148px }
.v-dash .tiles.t3 .tile::after { content: "" }
.v-dash .tiles.t3 .tile:nth-child(1) { --ill: var(--ill-moneybag) }
.v-dash .tiles.t3 .tile:nth-child(2) { --ill: var(--ill-chart) }
.v-dash .tiles.t3 .tile:nth-child(3) { --ill: var(--ill-wings) }
.v-dash .tiles.t3 .tile .spark { right: 108px }
/* paies : petites illustrations */
.v-pay .tiles .tile::after { content: ""; width: 44px; height: 44px; top: 12px; right: 12px }
.v-pay .tiles .tile .tile-h { padding-right: 44px }
.v-pay .tiles .tile:nth-child(1) { --ill: var(--ill-wings) }
.v-pay .tiles .tile:nth-child(2) { --ill: var(--ill-card) }
.v-pay .tiles .tile:nth-child(3) { --ill: var(--ill-briefcase) }
.v-pay .tiles .tile:nth-child(4) { --ill: var(--ill-moneybag) }
.v-pay .tiles .tile:nth-child(5) { --ill: var(--ill-coin) }
.v-pay .tile-v { font-size: 26px }
.v-pay .tiles .tile-v .pay-eq { display: block; margin: 3px 0 0; font-size: 13px; vertical-align: 0 }
.tile.hl .tile-v { color: var(--money) }
@media (max-width: 600px) {
  .tile::after { width: 46px; height: 46px; top: 10px; right: 10px }
  .tile .tile-h { padding-right: 44px }
  .v-dash .tiles.t3 .tile.hl::after { width: 64px; height: 64px }
  .v-pay .tiles .tile::after { content: none }
  .v-pay .tiles .tile .tile-h { padding-right: 0 }
  .v-dash .dash-rank-card:has(.hist-podium)::after { width: 48px; height: 48px }
}
/* classement : trophée dans le coin, halo doré */
