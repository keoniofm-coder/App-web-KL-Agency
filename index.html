        const first = (accs.find(k => k.modelId === mo.id) || {}).key || '';
        h += `<td><div class="pv-c">${ids.length ? `<span class="pv-k">${ids.length}</span>` : ''}${names}<button type="button" class="pv-plus" data-act="pvEd" data-d="${d}" data-slot="${sl.k}" data-acct="${first}" ${S.canWrite ? '' : 'disabled'} aria-label="${esc(`Ajouter un chatteur ${sl.l.toLowerCase()} sur ${mo.name}`)}">+</button></div></td>`;
      });
      h += '</tr>';
    });
    h += `</tbody></table></div></div>`;
  }
  h += `<div class="pld-roster">${SLOTS.map(sl => {
    const ids = Object.keys(by[sl.k]).sort(pvName);
    const rows = ids.map(id => { const off = isOff(id, td);
      return `<button type="button" class="pld-rr pv-rr ${off ? 'off' : ''}" data-act="pvEd" data-c="${id}" data-d="${d}" data-slot="${sl.k}" title="Modifier ${esc(cName(id))}"><span class="av sm" style="background:${chatterColor(id)}">${esc(initials(cName(id)))}</span><div><b>${esc(cName(id))}</b>${cnt(id) > 1 ? pvDbl : ''}${off ? '<small class="pv-offt">day off aujourd\'hui</small>' : ''}<div class="pld-ra">${plAcctGroup([...new Set(by[sl.k][id])])}</div>${pvBoxLine(d, sl.k, id, by[sl.k][id])}</div></button>`; }).join('');
    return `<div class="card pld-rs" style="--c:${slotVar(sl.k)}"><div class="pld-rh">${slotPill(sl.k)}<small>${sl.h}</small><span>${ids.length}</span></div>${rows || '<p class="muted pld-re">Personne</p>'}
      <button type="button" class="pv-add" data-act="pvEd" data-d="${d}" data-slot="${sl.k}" ${S.canWrite ? '' : 'disabled'}>+ Ajouter</button></div>`;
  }).join('')}</div>`;
  const offL = l => l.map(id => `<span class="pld-tag off">${esc(cName(id))}</span>`).join('');
  if (idle.length || offT.length || offN.length) h += `<div class="card pld-idle">${idle.length ? `<div><b>Pas dans le planning</b><span>${idle.map(c => `<button type="button" class="pld-tag pv-tag" data-act="pvEd" data-c="${c.id}" data-d="${d}" ${habSlot(c) ? `data-slot="${habSlot(c)}"` : ''} title="Placer ${esc(c.name)}"><span class="av sm" style="background:${chatterColor(c.id)}">${esc(initials(c.name))}</span>${esc(c.name)}${habSlots(c.shift).length ? ' ' + habSlots(c.shift).map(slotPill).join('') : ''}</button>`).join('')}</span></div>` : ''}${offT.length ? `<div><b>Day off aujourd'hui</b><span>${offL(offT)}</span></div>` : ''}${offN.length ? `<div><b>Day off demain</b><span>${offL(offN)}</span></div>` : ''}</div>`;
  h += `<p class="hint mt">C'est le planning de tous les jours : ce que tu changes ici vaut à partir du prochain shift qui n'a pas commencé, et les jours suivants. Les chatteurs en day off sont retirés de leur jour tout seuls. Pour le shift en cours ou le suivant seulement, passe par Discord (ou Pointage). Clique sur une box pour la changer, sur ▾ pour changer de modèle, sur un nom pour changer son créneau ou le retirer.</p>`;
  return `<div class="pl pld">${h}</div>`;
}
// un chatteur dans le planning habituel : ses créneaux, ses comptes et ses box
function tplEditor(cid, slot, acct) {
  const mine = id => planOf(TPL).filter(s => s.chatterId === id);
  const E = { cid, slots: new Set(), orig: new Set(), accts: new Set(), boxes: {}, pick: !cid, all: false };
  const init = () => {
    const c = S.chatters[E.cid]; E.slots = new Set(); E.orig = new Set(); E.accts = new Set(acct ? [acct] : []); E.boxes = {};
    if (!c) { if (slot) E.slots.add(slot); return; }
    const on = mine(E.cid).filter(s => !slot || s.slot === slot);
    if (on.length) { E.accts = new Set(); on.forEach(s => { E.slots.add(s.slot); E.orig.add(s.slot); (s.accts || []).forEach(k => E.accts.add(k)); Object.entries(s.boxes || {}).forEach(([m, v]) => { const l = boxList(v); if (l.length && !E.boxes[m]) E.boxes[m] = l; }); }); }
    else { if (slot) E.slots.add(slot); else (habSlots(c.shift).length ? habSlots(c.shift) : ['matin']).forEach(k => E.slots.add(k)); if (!acct) (c.shift?.accts || []).forEach(k => E.accts.add(k)); }
  };
  init();
  const models = () => sortedBy(S.models).filter(x => x.active !== false && (x.platforms || []).length);
  const o = modal(`<div class="modal-h ps-eh"><div class="who" data-who></div><button class="icon-btn" type="button" data-close aria-label="Fermer">${ICONS.x}</button></div><div class="ps-eb"></div>
    <div class="modal-f ps-ef"><button class="btn ghost pl-danger" type="button" data-psrm>Retirer du planning</button><span style="flex:1"></span><button class="btn" type="button" data-close>Annuler</button><button class="btn primary" type="button" data-pssave>Enregistrer</button></div>`, 'ps-modal');
  const body = $('.ps-eb', o);
  const chatOpts = () => {
    const act = activeChatters().slice().sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'fr'));
    const txt = c => { const on = mine(c.id).map(s => slotL(s.slot)); return c.name + (on.length ? ' · déjà ' + on.join(' + ') : ''); };
    const free = act.filter(c => !mine(c.id).length), oth = act.filter(c => !free.includes(c));
    const opt = c => `<option value="${c.id}" ${c.id === E.cid ? 'selected' : ''}>${esc(txt(c))}</option>`;
    return `<option value="">Choisir un chatteur…</option>${free.length ? `<optgroup label="Pas encore dans le planning">${free.map(opt).join('')}</optgroup>` : ''}${oth.length ? `<optgroup label="Déjà dans le planning">${oth.map(opt).join('')}</optgroup>` : ''}`;
  };
  const draw = () => {
    const c = S.chatters[E.cid];
    $('[data-who]', o).innerHTML = c ? `<span class="av" style="background:${chatterColor(E.cid)}">${esc(initials(c.name))}</span><div><h2>${esc(c.name)}</h2><p class="hint" style="margin:0">Planning habituel, tous les jours</p></div>` : `<div><h2>Ajouter au planning</h2><p class="hint" style="margin:0">Planning habituel, tous les jours</p></div>`;
    const usedM = new Set([...E.accts].map(k => splitAcct(k).modelId));
    const ms = models().filter(x => E.all || usedM.has(x.id) || !usedM.size); const hidden = models().length - ms.length;
    const ns = E.slots.size; const sl = [...E.slots].sort((a, b) => slotIdx(a) - slotIdx(b)).map(slotL).join(' + ');
    const others = c ? mine(E.cid).filter(s => !E.orig.has(s.slot) && !E.slots.has(s.slot)) : [];
    body.innerHTML = `
      ${E.pick ? `<div class="ps-es"><div class="ps-el">Chatteur</div><select data-pick aria-label="Chatteur">${chatOpts()}</select></div>` : ''}
      <div class="ps-es"><div class="ps-el">Créneau <small>${ns > 1 ? 'double shift' : 'coche-en deux pour un double shift'}</small></div><div class="ps-slots">${SLOTS.map(s => `<button type="button" class="ps-slot ${E.slots.has(s.k) ? 'on' : ''}" style="--c:${slotVar(s.k)}" data-slot="${s.k}" aria-pressed="${E.slots.has(s.k)}"><b>${E.slots.has(s.k) ? '✓ ' : ''}${s.l}</b><small>${s.h}</small></button>`).join('')}</div></div>
      <div class="ps-es"><div class="ps-el">Comptes et box <small>${E.accts.size} coché${plS(E.accts.size)}</small></div><div class="ps-models">${ms.map(x => `<div class="ps-mr"><span class="ps-mn"><i style="background:${modelColor(x.id)}"></i>${esc(x.name)}</span><span class="ps-pf">${(x.platforms || []).filter(p => S.platforms[p]).map(p => { const k = x.id + '|' + p; return `<button type="button" class="ps-p ${E.accts.has(k) ? 'on' : ''}" style="--c:${platColor(p)}" data-acct="${k}" aria-pressed="${E.accts.has(k)}">${E.accts.has(k) ? '✓ ' : ''}${esc(pName(p))}</button>`; }).join('')}</span>${usedM.has(x.id) ? `<button type="button" class="ps-bx ${E.boxes[x.id]?.length ? 'on' : ''}" data-bx="${x.id}" aria-haspopup="dialog" aria-label="Box sur ${esc(x.name)}">${E.boxes[x.id]?.length ? esc(boxesL(E.boxes[x.id])) : 'Box…'}</button>` : ''}</div>`).join('')}${hidden ? `<button type="button" class="pl-clear ps-more" data-allm>Afficher les ${hidden} autres modèles</button>` : ''}</div></div>
      <p class="ps-sum">${c && ns && E.accts.size ? `<b>${esc(c.name)}</b> sera en <b>${esc(sl)}</b>${ns > 1 ? ' (double shift)' : ''} sur ${E.accts.size} compte${plS(E.accts.size)}${(b => b.length ? ` (${b.join(', ')})` : '')(Object.entries(E.boxes).filter(([m, v]) => v && v.length && usedM.has(m)).map(([m, v]) => `${esc(mName(m))} ${esc(boxesL(v))}`))}, tous les jours à partir du prochain shift.${others.length ? ` Son shift ${esc(others.map(s => slotL(s.slot)).join(' + '))} ne change pas.` : ''}` : !c ? 'Choisis un chatteur.' : 'Choisis au moins un créneau et un compte.'}</p>`;
    $('[data-pssave]', o).disabled = !(S.canWrite && c && ns && E.accts.size);
    $('[data-psrm]', o).disabled = !(S.canWrite && c && mine(E.cid).some(s => E.orig.has(s.slot) || E.slots.has(s.slot)));
  };
  body.addEventListener('change', e => { if (e.target.dataset.pick == null) return; E.cid = e.target.value; init(); draw(); });
  body.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.bx) { const mid = b.dataset.bx; boxPicker(b, E.boxes[mid] || [], mName(mid), v => { E.boxes[mid] = v; draw(); const t = $(`[data-bx="${mid}"]`, body); t && t.focus(); }); return; }
    if (b.dataset.slot) { E.slots.has(b.dataset.slot) ? E.slots.delete(b.dataset.slot) : E.slots.add(b.dataset.slot); }
    else if (b.dataset.acct) { E.accts.has(b.dataset.acct) ? E.accts.delete(b.dataset.acct) : E.accts.add(b.dataset.acct); }
    else if ('allm' in b.dataset) E.all = true;
    else return;
    draw();
  });
  $('[data-pssave]', o).onclick = async () => {
    const id = E.cid, slots = [...E.slots], accts = [...E.accts]; const cur = mine(id); const patch = {}; const taken = [];
    cur.filter(s => E.orig.has(s.slot) || E.slots.has(s.slot)).forEach(s => { patch[s.sid] = null; });
    slots.forEach(sk => { const old = cur.find(s => s.slot === sk); const kb = keepBoxes(E.boxes, accts); patch[old ? old.sid : uid()] = tplFull({ slot: sk, chatterId: id, accts, ...kb }, old); taken.push(...boxTake(TPL, sk, id, kb.boxes, patch)); });
    const ok = await guard(() => tplWrite(patch), `${cName(id)} : planning habituel mis à jour`);
    if (ok) { closeModal(); if (taken.length) setTimeout(() => toast(taken.slice(0, 3).join(' · ')), 3300); }
  };
  $('[data-psrm]', o).onclick = () => {
    const id = E.cid; const l = mine(id).filter(s => E.orig.has(s.slot) || E.slots.has(s.slot)); if (!l.length) return;
    confirmBox(`Retirer ${cName(id)} ?`, `${cName(id)} sort du planning ${l.map(s => slotL(s.slot).toLowerCase()).join(' + ')} à partir du prochain shift, tous les jours.`, 'Retirer', async () => {
      const patch = {}; l.forEach(s => { patch[s.sid] = null; });
      if (await guard(() => tplWrite(patch), `${cName(id)} retiré du planning`)) closeModal();
    });
  };
  draw();
  if (E.pick) { const s = $('[data-pick]', o); s && s.focus(); }
}

function planDay() {
  const d = S.pl.ref; const W = plWeekData(d);
  const by = pvSlots(d); const cnt = pvCount(d);
  const plan = planOf(d); const onIds = new Set(plan.map(s => s.chatterId));
  const offIds = [...new Set(offsOn(d).map(o => o.chatterId).filter(id => S.chatters[id]))];
  const idle = activeChatters().filter(c => !onIds.has(c.id) && !offIds.includes(c.id));
  const gapOf = sl => pvGaps(W, d, sl);
  const holes = SLOTS.reduce((n, sl) => n + gapOf(sl.k).length, 0);
  const dbl = [...onIds].filter(id => cnt(id) > 1).length;
  const prevN = planOf(addDays(d, -1)).length;
  let h = `<div class="card ps-bar"><div class="ps-stats">${pvStat(onIds.size, ` chatteur${plS(onIds.size)}`, 'var(--fg)')}${pvStat(holes, ' à couvrir', holes ? 'var(--warn)' : 'var(--good)')}${dbl ? pvStat(dbl, ` double${plS(dbl)} shift${plS(dbl)}`, 'var(--s3)') : ''}${pvStat(offIds.length, ' day off', 'var(--bad)')}</div>
    <div class="ps-acts">${plan.length ? `<button class="btn primary" type="button" data-act="pvCopyDay">Copier cette journée vers…</button>` : ''}${prevN ? `<button class="btn" type="button" data-act="pldPrev">Reprendre la veille</button>` : ''}${plan.length ? `<button class="btn" type="button" data-act="dcSend">${IC.send}Envoyer sur Discord</button>` : ''}${plan.length ? `<button class="btn ghost pl-danger" type="button" data-act="pldClear">Vider</button>` : ''}</div></div>${dcPostMsg(d)}`;
  // tableau du jour : créneaux en lignes, modèles en colonnes (même lecture que la semaine)
  const accs = accounts(); const mods = sortedBy(S.models).filter(x => accs.some(k => k.modelId === x.id) && (x.active !== false || plan.some(s => (s.accts || []).some(k => splitAcct(k).modelId === x.id))));
  if (mods.length) {
    h += `<div class="card pv-card pv-daycard"><div class="pv-scroll"><table class="pv-wk pv-day" style="min-width:${Math.max(560, 120 + mods.length * 190)}px"><thead><tr><th class="pv-corner" scope="col"></th>${mods.map(mo => `<th scope="col"><span class="pv-mh"><i style="background:${modelColor(mo.id)}"></i>${esc(mo.name)}</span></th>`).join('')}</tr></thead><tbody>`;
    SLOTS.forEach(sl => {
      const gaps = gapOf(sl.k);
      h += `<tr style="--c:${slotVar(sl.k)}"><th scope="row" class="pv-sl">${slotPill(sl.k)}<small>${sl.h}</small></th>`;
      mods.forEach(mo => {
        const bx = {}; by[sl.k] && Object.keys(by[sl.k]).forEach(id => { bx[id] = boxList(boxOf(d, sl.k, id, mo.id)); });
        const ids = Object.keys(by[sl.k]).filter(id => by[sl.k][id].some(k => splitAcct(k).modelId === mo.id)).sort((a, b) => pvBoxIdx(bx[a][0]) - pvBoxIdx(bx[b][0]) || pvName(a, b));
        const names = ids.map(id => { const off = isOff(id, d); const pl = [...new Set(by[sl.k][id].filter(k => splitAcct(k).modelId === mo.id).map(k => splitAcct(k).platformId))];
          const b = bx[id], same = ids.filter(x => x !== id && bx[x].some(v => isBoxN(v) && b.includes(v)));
          return `<div class="pv-nb ${off ? 'off' : ''}"><button type="button" class="pv-n ${off ? 'off' : ''}" data-act="pvEd" data-c="${id}" data-d="${d}" data-slot="${sl.k}" title="${esc(`${cName(id)}${off ? ' (day off)' : ''} · ${mo.name} ${pl.map(pName).join(', ')}`)}"><i style="background:${chatterColor(id)}"></i><span>${esc(cName(id))}</span>${cnt(id) > 1 ? pvDbl : ''}${plStTag(attOf(d, sl.k, id)?.status)}</button><button type="button" class="pv-bxt ${b.length ? 'on' : ''} ${same.length ? 'dup' : ''}" data-act="pvBox" data-d="${d}" data-slot="${sl.k}" data-c="${id}" data-m="${mo.id}" ${S.canWrite ? '' : 'disabled'} aria-haspopup="dialog" aria-label="${esc(`Box de ${cName(id)} sur ${mo.name}${b.length ? ' : ' + boxesL(b) : ''}`)}" title="${esc(same.length ? `${boxesL(b)} · même box que ${same.map(cName).join(', ')}` : b.length ? boxesL(b) : `Choisir les box de ${cName(id)} sur ${mo.name}`)}">${b.length ? esc(boxesL(b)) : '+ Box'}</button>${S.canWrite ? `<button type="button" class="pv-pls pv-mdb" data-act="attModel" data-d="${d}" data-slot="${sl.k}" data-c="${id}" data-m="${mo.id}" aria-haspopup="dialog" aria-label="${esc(`Passer ${cName(id)} sur un autre modèle que ${mo.name}`)}" title="${esc(`Passer ${cName(id)} sur un autre modèle`)}">` : '<span class="pv-pls">'}${pl.map(x => `<b class="pv-pc" style="--c:${platColor(x)}">${esc(plCode(x))}</b>`).join('')}${S.canWrite ? '<svg class="pl-agc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>' : '</span>'}</div>`; }).join('');
        const mg = gaps.filter(k => splitAcct(k).modelId === mo.id);
        const first = mg[0] || (accs.find(k => k.modelId === mo.id) || {}).key || '';
        h += `<td><div class="pv-c">${ids.length ? `<span class="pv-k">${ids.length}</span>` : ''}${names}${mg.length ? `<button type="button" class="pv-g" data-act="pvEd" data-d="${d}" data-slot="${sl.k}" data-acct="${mg[0]}">${esc(mg.map(k => pName(splitAcct(k).platformId)).join(', '))} à couvrir</button>` : ''}<button type="button" class="pv-plus" data-act="pvEd" data-d="${d}" data-slot="${sl.k}" data-acct="${first}" aria-label="${esc(`Ajouter un chatteur ${sl.l.toLowerCase()} sur ${mo.name}`)}">+</button></div></td>`;
      });
      h += '</tr>';
    });
    h += `</tbody></table></div></div>`;
  }
  h += `<div class="pld-roster">${SLOTS.map(sl => {
    const ids = Object.keys(by[sl.k]).sort(pvName); const gaps = gapOf(sl.k);
    const rows = ids.map(id => { const off = isOff(id, d); const st = attOf(d, sl.k, id)?.status;
      return `<button type="button" class="pld-rr pv-rr ${off ? 'off' : ''}" data-act="pvEd" data-c="${id}" data-d="${d}" data-slot="${sl.k}" title="Modifier ${esc(cName(id))}"><span class="av sm" style="background:${chatterColor(id)}">${esc(initials(cName(id)))}</span><div><b>${esc(cName(id))}</b>${cnt(id) > 1 ? pvDbl : ''}${off ? '<small class="pv-offt">day off</small>' : plStTag(st)}<div class="pld-ra">${plAcctGroup([...new Set(by[sl.k][id])])}</div>${pvBoxLine(d, sl.k, id, by[sl.k][id])}</div></button>`; }).join('');
    return `<div class="card pld-rs" style="--c:${slotVar(sl.k)}"><div class="pld-rh">${slotPill(sl.k)}<small>${sl.h}</small><span>${ids.length}</span></div>${rows || '<p class="muted pld-re">Personne</p>'}
      ${gaps.length ? `<button type="button" class="pv-gap" data-act="pvEd" data-d="${d}" data-slot="${sl.k}" data-acct="${gaps[0]}"><b>À couvrir</b>${plAcctGroup(gaps)}</button>` : ''}
      <button type="button" class="pv-add" data-act="pvEd" data-d="${d}" data-slot="${sl.k}">+ Ajouter</button></div>`;
  }).join('')}</div>`;
  if (idle.length || offIds.length) h += `<div class="card pld-idle">${idle.length ? `<div><b>Sans shift ce jour-là</b><span>${idle.map(c => `<button type="button" class="pld-tag pv-tag" data-act="pvEd" data-c="${c.id}" data-d="${d}" ${habSlot(c) ? `data-slot="${habSlot(c)}"` : ''} title="Placer ${esc(c.name)}"><span class="av sm" style="background:${chatterColor(c.id)}">${esc(initials(c.name))}</span>${esc(c.name)}${habSlots(c.shift).length ? ' ' + habSlots(c.shift).map(slotPill).join('') : ''}</button>`).join('')}</span></div>` : ''}${offIds.length ? `<div><b>En day off</b><span>${offIds.map(id => `<span class="pld-tag off">${esc(cName(id))}</span>`).join('')}</span></div>` : ''}</div>`;
  h += `<p class="hint mt">Clique sur la box d'un chatteur pour la changer (All Inbox, ou une ou plusieurs box de 1 à 15), sur ▾ à sa droite pour le passer sur un autre modèle, ou sur son nom pour changer son créneau et ses comptes ; la box suit quand tu copies la journée ou la semaine. Utilise « + Ajouter » pour placer quelqu'un. Un chatteur peut faire deux créneaux (double shift).</p>`;

function planMonth() {

    return `<button type="button" class="pv-d ${inM ? '' : 'out'} ${d === td ? 'today' : ''} ${d < td ? 'past' : ''} ${n ? '' : 'unpl'}" data-act="psDay" data-d="${d}" aria-label="${esc(aria)}">

// période de comparaison : même nombre de jours écoulés, juste avant (ou le mois d'avant pour un mois)
function dashPrev(D, n) {

    return [pf, pt < pe ? pt : pe];

  const full = daysIn(D.from, D.to).length;
  // une seule journée : on la compare au même jour de la semaine d'avant
  if (full === 1) { const pd = addDays(D.from, -7); return [pd, pd]; }

// une modèle et sa paie dans une ligne (ok = déjà payée à part)
const payMc = (m, v, cls = '') => `<span class="pay-mc ${cls}" style="--c:${modelColor(m)}"><i></i>${esc(mName(m))} <b>${esc(fmtC(v))}</b>${cls === 'ok' ? ICONS.check : ''}</span>`;
// pénalités (−) et primes (+) d'une ligne, chacune dans sa monnaie
function payAdj(pens, prs, inView, main) {
  if (!pens.length && !prs.length) return '<span class="muted">–</span>';
  if (!inView) return `<span class="pay-adj"><small title="Pénalités et primes comptées avec sa paie de ${esc(mName(main))}">avec ${esc(mName(main))}</small></span>`;
  const p = curTot(pens), q = curTot(prs);
  return `<span class="pay-adj">${p.EUR || p.USD ? `<b class="bad">${esc(curTxt(p, '−', ' '))}</b>` : pens.length ? `<small>${pens.length} avertissement${payS(pens.length)}</small>` : ''}${q.EUR || q.USD ? `<b class="good">${esc(curTxt(q, '+', ' '))}</b>` : ''}</span>`;
}
// wallet crypto (fiche Discord ou Équipe), rangé à part dans wallets/<id> : seuls le propriétaire et ceux qu'il
// autorise (Gérer les accès) le voient. S.canWallets = false : on ne montre rien, même pas « Pas de wallet »
const walOf = id => S.canWallets === false ? '' : String(S.wallets?.[id]?.wallet || S.chatters[id]?.wallet || '').trim();
// wallet crypto : clic = copié
function payWal(id) {
  if (S.canWallets === false) return '';
  const w = walOf(id);
  if (!w) return '<span class="pay-wal none">Pas de wallet</span>';
  return `<button class="pay-wal" type="button" data-act="copywal" data-id="${id}" title="Copier le wallet : ${esc(w)}">${payIc.copy}${esc(w.length > 18 ? w.slice(0, 7) + '…' + w.slice(-5) : w)}</button>`;
}
HOOK.act.copywal = async (el, e) => {
  e?.stopPropagation(); const w = walOf(el.dataset.id); if (!w) return;
  try { await navigator.clipboard.writeText(w); toast(`Wallet de ${cName(el.dataset.id)} copié`); }
  catch (x) { const m = modal(`<div class="modal-h"><h2>Wallet de ${esc(cName(el.dataset.id))}</h2><button class="icon-btn" type="button" data-close aria-label="Fermer">${ICONS.x}</button></div><input id="walTxt" type="text" readonly value="${esc(w)}" style="font-family:ui-monospace,monospace"><div class="modal-f"><button class="btn primary" type="button" data-close>Fermer</button></div>`, 'sm'); const i = $('#walTxt', m); i.focus(); i.select(); }
};
HOOK.act.aband = (el, e) => { e?.stopPropagation(); toggleAband(el.dataset.id); };
// bas de Paies : une ligne par chatteur avec ses avertissements, ceux avec amende et le total à retirer (€ ou $)
function payPenSection(k, pens, rows, rate) {
  const hint = `Saisies sur Discord (🛠️ Admin › ⚠️ Pénalités), en € sauf si $ est choisi, retirées de la paie du ${esc(dLong(halfPayday(k)))}. Le compteur repart à zéro le 1er du mois.`;
  const head = secHead('Pénalités de la quinzaine', hint, pens.some(p => num(p.amount)) ? `<span class="pill bad">−${esc(curTxt(curTot(pens), '', ' −'))}</span>` : '');
  if (!pens.length) return `<section class="card mt pay-pen">${head}<div class="pay-none">${ICONS.check} Aucune pénalité ni avertissement sur cette quinzaine.</div></section>`;
  const payIds = new Set(rows.map(r => r.id)), outIds = new Set(rows.filter(r => !r.adjIn).map(r => r.id));
  const by = Object.values(groupBy(pens, p => p.cid || 'd:' + (p.uid || p.name))).map(l => ({ cid: l[0].cid, name: l[0].cid ? cName(l[0].cid) : l[0].name || 'Inconnu', l, n: l.length, nf: penFines(l), t: curTot(l), u: curUsd(l, rate) }))
    .sort((a, b) => b.u - a.u || b.n - a.n || a.name.localeCompare(b.name, 'fr'));
  const faults = l => Object.values(groupBy(l, 'fault')).map(x => `<span class="pay-pf">${esc(x[0].label || x[0].fault)} <b>×${x.length}</b></span>`).join('');
  const T = curTot(pens), U = curUsd(pens, rate);
  return `<section class="card mt pay-pen">${head}
    <div class="pay-pt" role="table" aria-label="Pénalités de la quinzaine">
      <div class="pay-ph" role="row"><span role="columnheader">Chatteur</span><span class="n" role="columnheader">Avertissements</span><span class="n" role="columnheader">Avec amende</span><span role="columnheader">Fautes</span><span class="n" role="columnheader">Pénalité</span><span class="n" role="columnheader">En $</span></div>
      ${by.map(x => `<div class="pay-pr ${x.cid && outIds.has(x.cid) ? 'out' : ''}" role="row">
        <span class="pay-who" role="cell"><span class="av" style="background:${x.cid ? chatterColor(x.cid) : 'var(--muted)'}">${esc(initials(x.name))}</span><span class="pay-wn"><b>${esc(x.name)}</b>${!x.cid ? '<span class="pay-chips"><span class="pill mute">Pas relié à l\'app</span></span>' : outIds.has(x.cid) ? `<span class="pay-chips"><span class="pill mute">Avec sa paie de ${esc(mName(rows.find(r => r.id === x.cid).main))}</span></span>` : x.u && !payIds.has(x.cid) ? '<span class="pay-chips"><span class="pill warn">Pas de paie ici</span></span>' : ''}</span></span>
        <span class="n" role="cell" data-l="Avertissements">${x.n}</span>
        <span class="n" role="cell" data-l="Avec amende">${x.nf}</span>
        <span class="pay-pfs" role="cell">${faults(x.l)}</span>
        <span class="n pay-pv ${x.u ? '' : 'zero'}" role="cell" data-l="Pénalité">${x.u ? '−' + esc(curTxt(x.t, '', ' −')) : '0 €'}</span>
        <span class="n muted" role="cell" data-l="En $">${x.u ? '−' + esc(fmtC(x.u)) : '–'}</span>
      </div>`).join('')}
      <div class="pay-pr pay-pft" role="row"><span role="cell">Total · ${by.length} chatteur${payS(by.length)}</span><span class="n" role="cell" data-l="Avertissements">${pens.length}</span><span class="n" role="cell" data-l="Avec amende">${penFines(pens)}</span><span role="cell"></span><span class="n pay-pv" role="cell" data-l="Pénalité">${U ? '−' + esc(curTxt(T, '', ' −')) : '0 €'}</span><span class="n muted" role="cell" data-l="En $">${U ? '−' + esc(fmtC(U)) : '–'}</span></div>

// une ligne de la liste de paie (+ son détail si ouverte)
function payRow(r, rate, st, k, sel) {
  const open = S.open === r.id; const ch = S.chatters[r.id];
  const pop = S.pay.just === r.id && Date.now() - (S.pay.justAt || 0) < 1500;
  const m = ch?.method ? `<span class="pay-meth">${payIc.usdc}${esc(ch.method)}</span>` : '';
  const dd = d => fd(d || today(), { day: 'numeric', month: 'short' });
  let chip;
  if (r.abandon) chip = `<span class="pill bad">Abandon${r.it.abandonAt ? ' · ' + dd(r.it.abandonAt) : ''}</span>`;
  else if (r.paid) chip = `<span class="pill good">${ICONS.check}Payé le ${dd(r.paidAt)}</span>`;
  else if (r.part) chip = `<span class="pill info">Payé en partie</span>`;
  else if (st.c === 'bad') chip = '<span class="pill bad">En retard</span>';
  else if (st.c === 'info') chip = `<span class="pill mute">Paie le ${dd(halfPayday(k))}</span>`;
  else chip = '<span class="pill warn">À payer</span>';
  const drift = r.paid && r.it.paid && !sel && num(r.amount) > 0 && Math.abs(num(r.amount) - r.total) >= 0.01
    ? `<span class="pill warn" title="Montant coché : ${esc(fmtC(r.amount))}">Écart ${r.total > r.amount ? '+' : '−'}${esc(fmtC(Math.abs(r.total - r.amount)))}</span>` : '';
  const off = !ch ? '<span class="pill mute">Supprimé</span>' : ch.active === false && !r.abandon ? '<span class="pill mute">Inactif</span>' : '';
  const nm = esc(cName(r.id));
  const ms = r.byM.map(x => payMc(x.m, x.com, r.part && r.pset.has(x.m) ? 'ok' : '')).join('')
    + (sel ? r.allM.filter(x => !sel.has(x)).map(x => `<span class="pay-mc out" style="--c:${modelColor(x)}" title="Hors choix : pas comptée ici"><i></i>${esc(mName(x))}</span>`).join('') : '')
    || '<span class="muted">Prime seule</span>';
  return `<div class="pay-row ${r.paid ? 'paid' : ''} ${r.abandon ? 'ab' : ''} ${open ? 'open' : ''}" role="listitem" data-act="toggle" data-id="${r.id}">
    <span class="pay-cb"><button class="pay-box ${r.paid ? 'on' : ''} ${pop ? 'pop' : ''}" type="button" data-act="paid" data-id="${r.id}" aria-pressed="${r.paid}" aria-label="${r.paid ? 'Repasser ' + nm + ' en attente' : 'Marquer ' + nm + ' comme payé'}${sel ? ' (' + esc(paySelName()) + ')' : ''}">${ICONS.check}</button></span>
    <span class="pay-cb"><button class="pay-box ab ${r.abandon ? 'on' : ''}" type="button" data-act="aband" data-id="${r.id}" aria-pressed="${r.abandon}" aria-label="${r.abandon ? 'Annuler l\'abandon de ' + nm : nm + ' est parti (abandon)'}" title="Abandon : chatteur parti">${IC.leave}</button></span>
    <span class="pay-who"><span class="av" style="background:${chatterColor(r.id)}">${esc(initials(cName(r.id)))}</span><span class="pay-wn"><span class="pay-wl"><b title="${nm}">${nm}</b>${chip}${drift}${off}</span><span class="pay-wl2">${m}${payWal(r.id)}</span></span></span>
    <span class="pay-ms">${ms}</span>
    <span class="pay-nums"><span class="n" data-l="Shifts">${r.s.shifts}</span><span class="n" data-l="CA net">${payE(r.s.net, rate)}</span><span class="n" data-l="Pén. / primes">${payAdj(r.pens, r.primes, r.adjIn, r.main)}</span></span>
    <span class="n pay-tot">${r.paid ? `<span class="pay-tick">${ICONS.check}</span>` : ''}${payAmt(r.total)}${payEq(r.total, rate)}${r.part ? `<small class="pay-left">reste ${esc(fmtC(r.left))} · ${esc(fmtC(r.left / (num(rate) || 1), 'EUR'))}</small>` : ''}</span>
    <button class="pay-chev" type="button" data-act="toggle" data-id="${r.id}" aria-expanded="${open}" aria-label="${open ? 'Masquer' : 'Voir'} le détail de ${nm}">${payIc.chev}</button>
  </div>${open ? `<div class="pay-detail" role="listitem">${payDetail(r, rate)}</div>` : ''}`;
}
function payDetail(r, rate) {
  const byA = Object.entries(groupBy(r.l, e => e.modelId + '|' + e.platformId)).map(([k, l]) => ({ k, l, s: agg(l, rate) })).sort((a, b) => b.s.com - a.s.com);
  const byD = groupBy(r.l, 'date');
  const amax = Math.max(1, ...byA.map(x => x.s.com));
  const dk = Object.keys(byD).sort(); const ds = dk.map(d => agg(byD[d], rate)); const dmax = Math.max(1, ...ds.map(s => s.com));
  const fees = Object.entries(groupBy(r.l, 'platformId')).map(([pid, l]) => pName(pid) + ' ' + [...new Set(l.map(e => e.inp === 'net' ? 'tapé en net' : pct(num(e.fee ?? S.platforms[pid]?.fee ?? 20))))].join(' ou '));
  const crs = [...new Set(r.l.map(e => num(e.rate ?? S.chatters[e.chatterId]?.rate ?? 10)))].sort((a, b) => a - b);
  const eur = r.l.some(e => (e.cur || curOf(e.platformId)) === 'EUR');
  const how = r.l.length ? `<p class="pay-how"><b>Net</b> = CA brut moins les frais de la plateforme (${esc(fees.join(', '))}). <b>Paie</b> = ${crs.map(x => pct(x)).join(' ou ')} du net${eur ? `, payée en $ au taux de la quinzaine : 1 € = $${num(rate).toLocaleString('fr-FR')}` : ''}.</p>` : '';
  const best = dk.length ? dk[ds.reduce((bi, s, i) => s.com > ds[bi].com ? i : bi, 0)] : '';
  return `<div class="pay-dt">
    <div class="pay-dsum">${r.l.length ? `<span class="pay-dsb">CA brut <b>${payE(r.s.gross, rate)}</b></span><span class="pay-dsb">Net <b>${payE(r.s.net, rate)}</b></span>` : ''}<span><b>${byA.length}</b> compte${payS(byA.length)}</span><span><b>${dk.length}</b> jour${payS(dk.length)} travaillé${payS(dk.length)}</span><span><b>${r.s.shifts}</b> shift${payS(r.s.shifts)}</span><span>Moyenne <b>${fmtC(r.total / Math.max(1, r.s.shifts))}</b> par shift</span>${best ? `<span>Meilleur jour <b>${esc(dShort(best))}</b></span>` : ''}</div>
    <div class="pay-dcols">
      <div class="pay-dbox"><div class="pay-dh">Par compte</div>
        <div class="pay-dl pay-da"><div class="pay-dlh" aria-hidden="true"><span>Compte</span><span class="n">CA brut</span><span class="n">Net</span><span class="n">Paie</span></div>
        ${byA.map(({ k, s }) => { const a = splitAcct(k); const c = curOf(a.platformId); return `<div class="pay-dr" style="--c:${modelColor(a.modelId)}"><span class="pay-dn">${modelDot(a.modelId)}${platBadge(a.platformId)}</span><span class="n" data-l="CA brut">${fmtC(s[c].gross, c)}</span><span class="n" data-l="Net">${fmtC(s[c].net, c)}</span><span class="n pay-dv">${fmtC(s[c].com, c)}</span><span class="pay-dbar"><i style="width:${(s.com / amax * 100).toFixed(1)}%"></i></span></div>`; }).join('')}</div>${how}</div>
      <div class="pay-dbox"><div class="pay-dh">Par jour</div>
        <div class="pay-dl pay-dd"><div class="pay-dlh" aria-hidden="true"><span>Jour</span><span>Shift</span><span class="n">CA brut</span><span class="n">Net</span><span class="n">Paie $</span></div>
        ${dk.map((d, i) => { const l = byD[d]; const s = ds[i]; const sl = [...new Set(l.map(e => e.slot))].sort((a, b) => slotIdx(a) - slotIdx(b)); return `<div class="pay-dr ${d === best ? 'best' : ''}"><span class="pay-dn pay-date">${esc(cap(fd(d, { weekday: 'short' })).replace('.', ''))} <b>${parse(d).getDate()}</b></span><span class="pay-sl">${sl.map(x => slotPill(x)).join('')}</span><span class="n" data-l="CA">${[...new Set(l.map(e => e.cur || curOf(e.platformId)))].map(c => fmtC(s[c].gross, c)).join(' + ')}</span><span class="n" data-l="Net">${[...new Set(l.map(e => e.cur || curOf(e.platformId)))].map(c => fmtC(s[c].net, c)).join(' + ')}</span><span class="n pay-dv">${fmtC(s.com)}</span><span class="pay-dbar day"><i style="width:${(s.com / dmax * 100).toFixed(1)}%"></i></span></div>`; }).join('')}</div></div>
      ${r.pens.length || r.primes.length ? `<div class="pay-dbox pay-dpen"><div class="pay-dh">${[r.pens.length && `Pénalités · ${r.pens.length} avertissement${payS(r.pens.length)}`, r.primes.length && `Primes · ${r.primes.length}`].filter(Boolean).join(' · ')}</div>
        <div class="pay-dl pay-dp"><div class="pay-dlh" aria-hidden="true"><span>Jour</span><span>Faute ou raison</span><span class="n">Montant</span></div>
        ${r.pens.map(p => `<div class="pay-dr"><span class="pay-dn pay-date">${esc(cap(fd(p.date, { weekday: 'short' })).replace('.', ''))} <b>${parse(p.date).getDate()}</b></span><span class="pay-pl">${esc(p.label || p.fault)} <span class="muted">· N°${esc(p.n)}</span>${p.note ? `<small>${esc(p.note)}</small>` : ''}</span><span class="n pay-dv ${num(p.amount) ? 'bad' : 'muted'}">${num(p.amount) ? '−' + esc(pAmt(p)) : 'Avertissement'}</span></div>`).join('')}
        ${r.primes.map(p => `<div class="pay-dr"><span class="pay-dn pay-date">${esc(cap(fd(p.date, { weekday: 'short' })).replace('.', ''))} <b>${parse(p.date).getDate()}</b></span><span class="pay-pl">💸 ${esc(p.reason || 'Prime')}</span><span class="n pay-dv good">+${esc(pAmt(p))}</span></div>`).join('')}</div>
        <div class="pay-dcalc">${r.adjIn ? `${esc(fmtC(r.base))}${r.penUsd ? ` <b class="bad">− ${esc(fmtC(r.penUsd))}</b>` : ''}${r.primeUsd ? ` <b class="good">+ ${esc(fmtC(r.primeUsd))}</b>` : ''} = <b>${esc(fmtC(r.total))}</b>` : `<span class="muted">Comptées avec sa paie de ${esc(mName(r.main))}</span>`}</div></div>` : ''}
    </div></div>`;
}
async function togglePaid(id) {
  const k = S.pay.key; const { rate, rows, sel } = payData(k); const r = rows.find(x => x.id === id); if (!r) return;
  const on = !r.paid, next = new Set(r.pset); r.byM.forEach(x => on ? next.add(x.m) : next.delete(x.m));
  const amtOf = m => r2((r.fullByM[m] || 0) + (m === r.main ? r.adjFull : 0));
  let val;
  if (on && (!r.allM.length || r.allM.every(m => next.has(m)))) val = { paid: true, paidAt: today(), amount: r.fullTotal, pm: null, abandon: false };
  else if (!next.size) val = { paid: false, pm: null };
  else val = { paid: false, abandon: false, pm: Object.fromEntries(r.allM.map(m => [m, next.has(m) ? (r.it.pm?.[m] || { at: today(), amount: amtOf(m) }) : null])) };
  S.pay.just = on ? id : ''; S.pay.justAt = Date.now();
  // affichage immédiat
  const po = S.payouts[k] || { key: k, items: {} }; S.payouts[k] = { ...po, rate, items: { ...(po.items || {}), [id]: { ...(po.items?.[id] || {}), ...val } } }; render();
  const what = sel ? ` (${paySelName()})` : '';
  await guard(async () => {
    const ref = db.doc('payouts/' + k); const s = await ref.get();
    if (!s.exists) await ref.set({ key: k, rate, items: { [id]: val } }); else await ref.update({ rate, items: { [id]: val } });
  }, on ? `${cName(id)} marqué payé${what} · ${fmtC(r.total)}` : `${cName(id)} repassé en attente${what}`);
}
// abandon : chatteur parti, sa paie n'est pas versée mais reste comptée à part (tuile Abandons)
async function toggleAband(id) {
  const k = S.pay.key; const { rate, rows } = payData(k); const r = rows.find(x => x.id === id); if (!r) return;
  const on = !r.abandon, val = on ? { abandon: true, abandonAt: today(), paid: false, pm: null } : { abandon: false };
  const po = S.payouts[k] || { key: k, items: {} }; S.payouts[k] = { ...po, rate, items: { ...(po.items || {}), [id]: { ...(po.items?.[id] || {}), ...val } } }; render();
  await guard(async () => {
    const ref = db.doc('payouts/' + k); const s = await ref.get();
    if (!s.exists) await ref.set({ key: k, rate, items: { [id]: val } }); else await ref.update({ rate, items: { [id]: val } });
  }, on ? `${cName(id)} en abandon · ${fmtC(r.fullTotal)} gardés${r.paid || r.part ? ' (n\'est plus marqué payé)' : ''}` : `${cName(id)} n'est plus en abandon`);
}

/* ---- classement (podium) ---- */
// chatteur visible dans les classements (ni inactif, ni supprimé)
const histShown = id => !!S.chatters[id] && S.chatters[id].active !== false;
// petite étiquette d'évolution colorée (▲ vert / ▼ rouge)
function histChip(a, b) {

      <div class="ps-mh"><span class="ps-mn"><i></i>${esc(md.name)}</span><span class="ps-pct">${esc(persoRule(md.id))}</span></div>
      <div class="ps-mv">${fmt0(v / n)}<small>chacun</small></div>
      <div class="ps-ms">${fmt0(v)} à ${n === 2 ? 'deux' : n} · net ${fmt0(r ? r.net : 0)}${pv || v ? ' ' + histChip(v, pv) : ''}</div>
      <div class="ps-bar"><span style="width:${(v / max * 100).toFixed(1)}%"></span></div>
      ${r ? `<div class="ps-pl">${r.plats.map(x => `<span>${platBadge(x.pid)}<b>${fmt0(x.net / n)}</b></span>`).join('')}</div>` : '<div class="ps-pl muted">Aucune vente ce mois-ci</div>'}
    </section>`; }).join('')}</div>`;
  // par plateforme
  const pPrev = Object.fromEntries(prev.plats.map(x => [x.pid, x.v])); const pmax = Math.max(1, ...cur.plats.map(x => x.v));
  if (cur.plats.length) h += `<h3 class="ps-sec">Par plateforme</h3><div class="ps-models ps-plats">${cur.plats.map(x => `<section class="card ps-m" style="--c:${platColor(x.pid)}">
      <div class="ps-mh">${platBadge(x.pid)}<span class="ps-pct">${cur.tot ? pct(x.v / cur.tot * 100) : '–'} du total</span></div>
      <div class="ps-mv">${fmt0(x.v / n)}<small>chacun</small></div>
      <div class="ps-ms">${fmt0(x.v)} à ${n === 2 ? 'deux' : n}${pPrev[x.pid] || x.v ? ' ' + histChip(x.v, pPrev[x.pid] || 0) : ''}</div>
      <div class="ps-bar"><span style="width:${(x.v / pmax * 100).toFixed(1)}%"></span></div>
      <div class="ps-pl">${x.models.sort((a, b) => b.v - a.v).map(y => `<span>${modelDot(y.mid)}<b>${fmt0(y.v / n)}</b></span>`).join('')}</div>
    </section>`).join('')}</div>`;
  // 6 derniers mois
  const months = []; for (let i = 5; i >= 0; i--) months.push(addMonths(isCur ? m : monthStart(td), -i));
  if (!months.includes(m)) { months.shift(); months.push(m); months.sort(); }
  const mv = months.map(x => persoOf(entries(x, monthEnd(x))).tot / n); const mmax = Math.max(1, ...mv);
  h += persoDaily(n, m);
  h += `<div class="grid g2e mt ps-low">
    <section class="card">${secHead('Cumul du mois', `Ce que chacun a gagné jour après jour. En pointillés : ${esc(fd(pm, { month: 'long' }))}.`)}
      <div class="ps-chart">${persoChart(m, n, isCur ? td : '')}</div>
      <div class="ps-leg"><span><i class="c"></i>${esc(cap(mLabel(m)))}</span><span><i class="p"></i>${esc(cap(mLabel(pm)))}</span></div></section>
    <section class="card">${secHead('6 derniers mois', 'Par personne. Clique sur un mois pour l\'afficher.')}
      <div class="ps-mo">${months.map((x, i) => `<button type="button" class="ps-mb ${x === m ? 'on' : ''} ${x === monthStart(td) ? 'now' : ''}" data-act="psMonth" data-m="${x}" aria-label="${esc(cap(mLabel(x)))} : ${esc(fmt0(mv[i]))}"><em>${mv[i] ? esc(short(mv[i])) + ' €' : '–'}</em><span class="ps-mt"><span style="height:${(mv[i] / mmax * 100).toFixed(1)}%"></span></span><small>${esc(cap(fd(x, { month: 'short' })).replace('.', ''))}</small></button>`).join('')}</div></section>
  </div>
  <p class="hint ps-foot">Calcul : ${shares.map(md => `${esc(md.name)} ${esc(persoRule(md.id, true))}`).join(' ; ')}. Divisé par ${n}. Montants en € (dollars convertis à 1 € = $${num(S.settings.eurUsd).toLocaleString('fr-FR')}).${S.me ? (accList('perso').length ? ` Page visible par ${accList('perso').length} personne${accList('perso').length > 1 ? 's' : ''}, à régler dans « Gérer les accès ».` : ' Page visible par tous les membres : choisis qui la voit dans « Gérer les accès ».') : ''}</p>`;
  $('#view').innerHTML = h; persoBind();
}
HOOK.act.psPrev = () => { S.persoV.m = addMonths(S.persoV.m, -1); ensureRange(S.persoV.m); render(); };
HOOK.act.psNext = () => { const nx = addMonths(S.persoV.m, 1); if (nx <= monthStart(today())) S.persoV.m = nx; render(); };
HOOK.act.psNow = () => { S.persoV.m = monthStart(today()); render(); };
HOOK.act.psMonth = el => { S.persoV.m = el.dataset.m; render(); };
HOOK.act.psEdit = () => {
  // modèles comptées (part > 0), chacune avec ses lignes de plateforme (frais propres à Revenu perso)
  const feeV = (mid, pid) => { const v = persoFee(mid, pid); return v == null ? '' : String(v); };
  const E = { n: persoN(), list: sortedBy(S.models).filter(x => persoPct(x.id)).map(x => ({ mid: x.id, pct: String(persoPct(x.id)), plats: persoPlats(x.id).map(pid => ({ pid, fee: feeV(x.id, pid) })) })) };
  const m = modal(`<div class="modal-h"><h2>Vos parts</h2><button class="icon-btn" type="button" data-close aria-label="Fermer">${ICONS.x}</button></div>
    <form id="psForm" class="frow" autocomplete="off"></form>
    <p class="hint" style="margin:0">Frais laissés vides : ceux de la plateforme, comme pour les chatteurs (réglés dans Équipe, ils ne changent pas ici). Une plateforme sans ligne compte aussi, avec ses frais habituels. Retirer une modèle = vous ne touchez plus rien dessus.</p>
    <div class="modal-f"><button class="btn" type="button" data-close>Annuler</button><button class="btn primary" type="button" data-save>Enregistrer</button></div>`, 'sm');
  const f = $('#psForm', m);
  const draw = () => {
    const inL = new Set(E.list.map(x => x.mid).filter(Boolean)); const rest = sortedBy(S.models).filter(x => !inL.has(x.id));
    f.innerHTML = E.list.map((x, i) => { const nm = x.mid ? S.models[x.mid]?.name || x.mid : ''; const left = sortedBy(S.platforms).filter(p => !x.plats.some(l => l.pid === p.id));
      return `<div class="f full ps-row"><span class="ps-in ps-mh">${x.mid ? `<span class="ps-rn">${esc(nm)}</span>` : `<input type="text" data-i="${i}" data-k="name" value="${esc(x.name || '')}" placeholder="Nom de la modèle" aria-label="Nom de la nouvelle modèle" style="width:170px">`}<input type="number" step="0.5" min="0" max="100" data-i="${i}" data-k="pct" value="${esc(x.pct)}" aria-label="Part sur ${esc(nm || 'la nouvelle modèle')}"><span>% du net</span><button type="button" class="icon-btn ps-x" data-rmm="${i}" aria-label="Retirer ${esc(nm || 'cette modèle')}" title="Retirer">${ICONS.x}</button></span>
        ${x.plats.map((l, j) => platInp(l.pid) === 'net' ? `<span class="ps-in ps-fee"><span>${esc(pName(l.pid))} : tapé en net, rien à retirer</span><button type="button" class="icon-btn ps-x" data-rmp="${i}|${j}" aria-label="Retirer ${esc(pName(l.pid))}" title="Retirer">${ICONS.x}</button></span>` : `<span class="ps-in ps-fee"><span>${esc(pName(l.pid))} : net = CA −</span><input type="number" step="0.5" min="0" max="100" data-i="${i}" data-j="${j}" data-k="fee" value="${esc(l.fee)}" placeholder="${num(S.platforms[l.pid]?.fee ?? 20)}" aria-label="Frais déduits sur ${esc(nm)} ${esc(pName(l.pid))}"><span>%</span><button type="button" class="icon-btn ps-x" data-rmp="${i}|${j}" aria-label="Retirer ${esc(pName(l.pid))}" title="Retirer">${ICONS.x}</button></span>`).join('')}
        ${left.length ? `<span class="ps-in ps-fee"><select data-addp="${i}" aria-label="Ajouter une plateforme à ${esc(nm || 'cette modèle')}"><option value="">+ Plateforme…</option>${left.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></span>` : ''}</div>`; }).join('')
      + `<div class="f full ps-row"><select data-addm aria-label="Ajouter une modèle"><option value="">+ Ajouter une modèle…</option>${rest.map(x => `<option value="${x.id}">${esc(x.name)}${x.active === false ? ' (inactive)' : ''}</option>`).join('')}<option value="__new">Nouvelle modèle…</option></select></div>
      <label class="f">Nombre d'associés<input type="number" step="1" min="1" data-k="n" value="${esc(String(E.n))}"></label>`;
  };
  f.addEventListener('input', e => { const t = e.target, k = t.dataset.k; if (!k) return; if (k === 'n') { E.n = t.value; return; } const x = E.list[+t.dataset.i]; if (!x) return; if (k === 'fee') x.plats[+t.dataset.j].fee = t.value; else x[k] = t.value; });
  f.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.addm != null && t.value) { const v = t.value; E.list.push(v === '__new' ? { mid: '', name: '', pct: '10', plats: [] } : { mid: v, pct: '10', plats: (S.models[v]?.platforms || []).filter(pid => S.platforms[pid]).map(pid => ({ pid, fee: feeV(v, pid) })) }); draw(); const q = v === '__new' ? f.querySelector(`[data-i="${E.list.length - 1}"][data-k="name"]`) : f.querySelector(`[data-i="${E.list.length - 1}"][data-k="pct"]`); q && q.focus(); }
    else if (t.dataset.addp != null && t.value) { const i = +t.dataset.addp; E.list[i].plats.push({ pid: t.value, fee: '' }); draw(); f.querySelector(`[data-i="${i}"][data-j="${E.list[i].plats.length - 1}"]`)?.focus(); }
  });
  f.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.rmm != null) { E.list.splice(+b.dataset.rmm, 1); draw(); }
    else if (b.dataset.rmp != null) { const [i, j] = b.dataset.rmp.split('|').map(Number); E.list[i].plats.splice(j, 1); draw(); }
  });
  draw();
  $('[data-save]', m).onclick = async () => {
    if (E.list.some(x => !x.mid && !String(x.name || '').trim())) { toast('Donne un nom à la nouvelle modèle.', true); return; }
    const ok = await guard(async () => {
      for (const x of E.list.filter(y => !y.mid)) { x.mid = 'm-' + uid(); await db.doc('models/' + x.mid).set({ name: x.name.trim(), platforms: x.plats.map(l => l.pid), notes: '', active: true }); }
      const shares = {}, fees = { ...(S.perso?.fees || {}) }, plats = { ...(S.perso?.plats || {}) };
      Object.keys(S.models).forEach(id => { shares[id] = 0; });
      E.list.forEach(x => {
        shares[x.mid] = num(x.pct); plats[x.mid] = x.plats.map(l => l.pid);
        Object.keys(S.platforms).forEach(pid => { const l = x.plats.find(y => y.pid === pid); fees[x.mid + '|' + pid] = l && String(l.fee).trim() !== '' ? num(l.fee) : ''; });
      });
      await db.doc('config/perso').set({ shares, fees, plats, partners: Math.max(1, Math.round(num(E.n)) || 2) });
    }, 'Parts enregistrées');
    if (ok) closeModal();
  };
};
render();
connect();
})();
</script>
