.v-dash td.wyc { font-size: 13px }
.v-dash .dr-ca small.dr-vt { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap }
.v-dash .dash-rank-card .dash-sort .seg { flex-wrap: wrap }
@media (min-width: 761px) {
  .v-dash .dr.wyon { min-width: 1000px }
  .v-dash .dr.wyon td, .v-dash .dr.wyon th, .v-dash .hist-rt.wyon td, .v-dash .hist-rt.wyon th { padding-left: 8px; padding-right: 8px }
  .v-dash .dr.wyon .dr-c1 { min-width: 180px }
  .v-dash .dr.wyon .dr-ca { min-width: 120px }
  .v-dash .dr.wyon .dr-tr { max-width: 130px }
  .v-dash .hist-rt.wyon .hist-cab { min-width: 110px }
  .v-dash .hist-rt.wyon .hist-tr { max-width: 140px }
}
@media (min-width: 761px) and (max-width: 1500px) {
  .v-dash .dr.wyon td, .v-dash .dr.wyon th, .v-dash .hist-rt.wyon td, .v-dash .hist-rt.wyon th { padding-left: 6px; padding-right: 6px }
  .v-dash .dr.wyon .dr-ca { min-width: 104px }
  .v-dash .dr.wyon .dr-tr { max-width: 110px }
  .v-dash .hist-rt.wyon .hist-cab { min-width: 96px }
  .v-dash .hist-rt.wyon .hist-tr { max-width: 120px }
  /* mois chargé : modèles du chatteur sur 2 lignes si besoin, pastilles de ponctualité 2 par ligne max */
  .v-dash .dr.wyon .dr-c1 { min-width: 140px }
  .v-dash .dr.wyon .who small { flex-wrap: wrap; row-gap: 0 }
  .v-dash .dr.wyon .dr-pu { min-width: 150px }
  .v-dash .dr.wyon .dr-pu .pill { font-size: 11px; padding-left: 7px; padding-right: 7px }
}
@media (max-width: 760px) {
  /* téléphone : chiffres rangés par 4, même grille pour chaque chatteur */
  .v-dash .dr.wyon tr { gap: 12px 12px }
  .v-dash .dr.wyon tr > td[data-l] { flex: 0 0 calc((100% - 36px) / 4); min-width: 0; margin-left: 0 }
  .v-dash .dr.wyon td.wyc { order: 3 }
  .v-dash .dr.wyon td.wy0 { display: none }
  .v-dash .dr.wyon .dr-pu { order: 4; flex: 1 1 calc((100% - 12px) / 2); padding-left: 0 }
  .v-dash .dr.wyon .dr-pu:not(:has(.muted)) { display: flex; flex-direction: column; align-items: flex-start; gap: 3px }
  .v-dash .dr.wyon .dr-pu::before { content: 'Ponctualité'; font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
  .v-dash .hist-rt { min-width: 0 }
  .v-dash .hist-rt thead { display: none }
  .v-dash .hist-rt tbody, .v-dash .hist-rt tr { display: block }
  .v-dash .hist-rt tr { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line) }
  .v-dash .hist-rt tbody tr:last-child { border-bottom: 0 }
  .v-dash .hist-rt td { display: block; padding: 0; border: 0; background: none !important }
  .v-dash .hist-rt td.hr-rk { width: auto; flex: 0 0 auto }
  .v-dash .hist-rt td.hr-who { flex: 1 1 calc(100% - 170px); min-width: 0 }
  .v-dash .hist-rt td.hr-ca { flex: 0 0 110px }
  .v-dash .hist-rt .hist-cab { min-width: 0; align-items: flex-end }
  .v-dash .hist-rt .hist-cab b { font-size: 15px }
  .v-dash .hist-rt .hist-tr { width: 100%; max-width: 110px }
  .v-dash .hist-rt tr > td[data-l] { flex: 0 0 calc((100% - 36px) / 4); min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; font-size: 12.5px; font-weight: 700; order: 2 }
  .v-dash .hist-rt td[data-l]::before { content: attr(data-l); font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
  .v-dash .hist-rt tr > td.hr-mv:not(:has(*)) { display: none }
  .v-dash .hist-rt tr > td.wyc { order: 3 }
  .v-dash .hist-rt tr > td.wy0 { display: none }
  .v-dash .hist-rt td.hr-pt { order: 4; flex: 1 1 calc((100% - 12px) / 2); display: flex; flex-direction: column; align-items: flex-start; gap: 3px }
  .v-dash .hist-rt td.hr-pt::before { content: 'Pointage'; font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
  .v-dash .hist-rt .hist-inc { flex-wrap: wrap }
}

/* v64 Équipe › Noms des plateformes */
.nm-card .card-head { flex-wrap: wrap; gap: 12px }
.nm-sec + .nm-sec { margin-top: 18px }
.nm-h { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 6px }
.nm-h b { font: 700 14px var(--f-display) }
.nm-h small { color: var(--muted); font-size: 12px; font-weight: 600 }
.nm-empty { margin: 4px 0 0 }
.nm-note { display: flex; gap: 8px; align-items: flex-start; margin: 2px 0 14px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: 13px; line-height: 1.45 }
.nm-note svg { width: 15px; height: 15px; flex: none; margin-top: 2px; color: var(--good) }
.nm-chips { display: flex; flex-wrap: wrap; gap: 6px }
.nm-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600 }
.nm-chip i { width: 8px; height: 8px; border-radius: 50% }
.nm-chip small { color: var(--muted); font-weight: 600; font-size: 12px }
.nm-acts .seg { flex-wrap: wrap }
.nm-tbl td.nm-when { color: var(--muted); font-size: 13px; white-space: nowrap }
.nm-tbl th:first-child { width: 42% }
.nm-tbl th:nth-child(2):not(:last-child) { width: 150px }
@media (max-width: 760px) {
  .nm-acts { width: 100% }
  .nm-acts .seg { width: 100% }
  .nm-acts .seg button { flex: 1 }
}

/* v64 Paies : brut / net en clair dans le détail */
.v-pay .pay-dd .pay-dlh, .v-pay .pay-dd .pay-dr { grid-template-columns: 58px minmax(0, 1fr) minmax(84px, max-content) minmax(76px, max-content) 72px }
.v-pay .pay-dd .pay-dr > [data-l="Net"] { color: var(--muted) }
.v-pay .pay-dsum span.pay-dsb { color: var(--fg); border-color: color-mix(in srgb, var(--info) 35%, var(--line)) }
.v-pay .pay-how { margin: 8px 0 4px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 12px; line-height: 1.5; color: var(--muted) }
.v-pay .pay-how b { color: var(--fg); font-weight: 700 }
@media (max-width: 760px) {
  .v-pay .pay-dd .pay-dlh, .v-pay .pay-dd .pay-dr { grid-template-columns: minmax(0, 1fr) minmax(72px, max-content) minmax(66px, max-content) 62px; column-gap: 8px }
  .v-pay .pay-dd .pay-dlh > :nth-child(2) { display: none }
  .v-pay .pay-dd .pay-dlh > :nth-child(3), .v-pay .pay-dd .pay-dr > [data-l="CA"] { display: initial }
  .v-pay .pay-dd .pay-dr > .pay-date { grid-column: 1; grid-row: 1 }
  .v-pay .pay-dd .pay-dr > .pay-sl { grid-column: 1; grid-row: 2 }
  .v-pay .pay-dd .pay-dr > .n { grid-row: 1 / span 2 }
  .v-pay .pay-dd .pay-dr > [data-l="CA"], .v-pay .pay-dd .pay-dr > [data-l="Net"] { font-size: 12px }
}

/* v64 tableau de bord : haut compact sur téléphone */
.dtools { display: contents }
.dp-sel, .dp-rl, .sub-ph { display: none }
@media (max-width: 760px) {
  .topbar .tools > .dtools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; width: 100% }
  .dtools > .seg { display: none }
  .dtools .stepper { display: contents }
  /* le menu natif (roue de l'iPhone) est posé, invisible, sur une pastille qui prend juste la largeur du mot */
  .dtools .dp-sel { display: flex; align-items: center; gap: 6px; position: relative; flex: none; order: 1; height: 38px; padding: 0 10px 0 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--ctl-line, var(--line)); font-weight: 650; font-size: 15px; white-space: nowrap; cursor: pointer }
  .dtools .dp-sel svg { width: 14px; height: 14px; flex: none; color: var(--muted) }
  .dtools .dp-sel select { position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; opacity: 0; appearance: none; -webkit-appearance: none; font-size: 16px; cursor: pointer }
  .dtools .dp-sel:active { transform: scale(.97) }
  .dtools .dp-sel:focus-within { border-color: var(--accent) }
  .dtools .navstep { order: 2; flex: none; min-width: 38px; height: 38px; border-radius: 12px; font-size: 17px }
  .dtools .navstep[data-act="dnext"] { order: 4 }
  .dtools .dp-rl { all: unset; box-sizing: border-box; order: 3; flex: 1 1 0; min-width: 0; height: 38px; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 0 10px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--ctl-line, var(--line)); font-weight: 650; font-size: 15px; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent }
  .dtools .dp-rl span { overflow: hidden; text-overflow: ellipsis }
  .dtools .dp-rl svg { width: 15px; height: 15px; flex: none; color: var(--muted) }
  .dtools .dp-rl:active, .dtools .navstep:active { transform: scale(.97) }
  .dtools.open .dp-rl { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent) }
  .dtools #dfrom, .dtools #dto, .dtools .dp-ar { display: none }
  .dtools.open #dfrom, .dtools.open #dto { display: block; order: 6; flex: 1 1 0 !important; min-width: 0; height: 40px; text-align: center; border-radius: 12px; animation: dpIn .18s ease }
  .dtools.open .dp-ar { display: block; order: 6; flex: none; color: var(--muted) }
  .dtools.open::after { content: ''; order: 5; flex-basis: 100% }
  @keyframes dpIn { from { opacity: 0; transform: translateY(-4px) } }
  /* ligne sous le titre : la période est déjà dans le bouton, on garde « jour X sur Y » */
  .sub-dt { display: none }
  .sub-ph { display: inline }
  /* Général / Chatteurs / Plateformes / Telegram + filtre modèles sur une ligne */
  .v-dash .dash-subnav { margin-bottom: 12px }
  .v-dash .dash-subl { flex-wrap: nowrap; gap: 6px; width: 100% }
  .v-dash .dash-subl > .seg { display: flex; flex: 1 1 auto; min-width: 0; width: auto; padding: 3px }
  .v-dash .dash-subl > .seg button { flex: 1 0 auto; min-height: 32px; padding: 0 6px; font-size: 12.5px }
  .v-dash .dash-subl > .seg { gap: 0 }
  .v-dash .dash-subl > .msel { flex: none }
  .v-dash .dash-subl > .msel > summary { height: 38px; min-height: 38px; padding: 0 11px; gap: 0 }
  .v-dash .dash-subl > .msel .msel-t, .v-dash .dash-subl > .msel > summary > svg { display: none }
  .v-dash .dash-subr { display: none }
  .dv-lg { display: none }
}
@media (min-width: 761px) { .dv-sm { display: none } }
@media (max-width: 380px) { .v-dash .dash-subl > .seg button { padding: 0 5px; font-size: 12px } .dtools .dp-rl svg { display: none } }

/* v64 Ventes : montant tapé en brut ou en net */
.v-sales .ln .acw { display: flex; align-items: center; gap: 8px; min-width: 0 }
.v-sales .ln .acw > .acct { flex: 0 1 auto; min-width: 0 }
.v-sales .ln .acw > .msel { flex: 1 1 auto; min-width: 0; width: auto }
.inm { position: relative; flex: none; display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px 0 10px; border-radius: 999px; font-size: 12px; font-weight: 750; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); cursor: pointer; white-space: nowrap; transition: color .15s, background .15s, border-color .15s }
.inm svg { width: 11px; height: 11px; flex: none }
.inm:hover { color: var(--fg); border-color: color-mix(in srgb, var(--fg) 25%, var(--line)) }
.inm.net { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)) }
.inm select { position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; padding: 0; margin: 0; border: 0; opacity: 0; appearance: none; -webkit-appearance: none; font-size: 16px; cursor: pointer }
.inm:focus-within { outline: 2px solid var(--accent); outline-offset: 2px }
.inm:active { transform: scale(.97) }
.inm.inm-off { display: none }
.v-team .pill.inp-net { margin-right: 6px }
@media (max-width: 760px) {
  .v-sales .ln .acw > .inm { margin-left: auto; height: 30px; padding: 0 10px 0 12px; font-size: 13px }
}

/* v65 : une agence Wysper ne répond pas, les autres oui */
.wy-bar.warn { background: color-mix(in srgb, var(--warn) 7%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 30%, var(--line)) }
.warn > .wy-dot { background: var(--warn); box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 18%, transparent) }

/* v67 Revenu perso : revenu net par jour (dessin du tableau de bord) */
.v-perso .ps-daily { margin-top: 18px }
</style>

<script>
(() => {
/* ================= utilitaires ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const today = () => iso(new Date());
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.').replace(/\s/g, '')); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((n || 0) * 100) / 100;
const monday = s => { const d = parse(s); return addDays(s, -((d.getDay() + 6) % 7)); };
const monthStart = s => s.slice(0, 8) + '01';
const monthEnd = s => { const d = parse(s); return iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
const addMonths = (s, n) => { const d = parse(monthStart(s)); return iso(new Date(d.getFullYear(), d.getMonth() + n, 1)); };
const fd = (s, o) => parse(s).toLocaleDateString('fr-FR', o);
const dLong = s => fd(s, { weekday: 'long', day: 'numeric', month: 'long' });
const dShort = s => fd(s, { day: 'numeric', month: 'short' });
const mLabel = s => fd(s, { month: 'long', year: 'numeric' });
const daysIn = (a, b) => { const o = []; for (let d = a; d <= b; d = addDays(d, 1)) o.push(d); return o; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const SLOTS = [
  { k: 'matin', l: 'Matin', h: '08h – 14h' },
  { k: 'aprem', l: 'Aprem', h: '14h – 20h' },
  { k: 'soir', l: 'Soir', h: '20h – 02h' },
  { k: 'nuit', l: 'Nuit', h: '02h – 08h' }
];
// couleur de chaque créneau (tokens --sl-*) et pastille réutilisable
const slotVar = k => SLOTS.some(s => s.k === k) ? `var(--sl-${k})` : 'var(--muted)';
const slotPill = (k, txt) => `<span class="slp" style="--c:${slotVar(k)}">${esc(txt ?? (SLOTS.find(s => s.k === k)?.l || 'Sans shift'))}</span>`;
const slotL = k => SLOTS.find(s => s.k === k)?.l || 'Shift non précisé';
const slotIdx = k => { const i = SLOTS.findIndex(s => s.k === k); return i < 0 ? 9 : i; };
// créneaux du shift habituel : un, ou deux pour un double shift (ancien format : slot seul)
const habSlots = h => !h ? [] : [...new Set((Array.isArray(h.slots) && h.slots.length ? h.slots : [h.slot]).filter(k => SLOTS.some(x => x.k === k)))].sort((a, b) => slotIdx(a) - slotIdx(b));
const habSlot = c => habSlots(c?.shift)[0] || '';
const STATUS = { present: ['Présent', 'good'], retard: ['Retard', 'warn'], coupure: ['Coupure', 'info'], absent: ['Absent', 'bad'] };
const MODEL_COLORS = ['#C2477A', '#3D6FB4', '#2A9886', '#C2862A', '#7A5BC4', '#5B8C2E', '#D0603A', '#2C8FB8'];
const PLAT_COLORS = ['#6C4FB3', '#2A9886', '#C2862A', '#3D6FB4', '#C2477A', '#5B8C2E'];
const CHATTER_COLORS = ['#6C4FB3', '#B4235A', '#1F7A8C', '#A6612A', '#3F7D3A', '#8C3FA6', '#2F5DA8', '#9C4A3A', '#2A8C6E', '#7A6A1F'];

/* ================= état ================= */
const S = {
  chatters: {}, models: {}, platforms: {}, days: {}, plan: {}, att: {}, offs: {}, payouts: {}, penalties: {}, primes: {}, reattrib: {}, wallets: {},
  settings: { eurUsd: 1.12, dayOffQuota: 3 },
  loaded: {}, live: false, canWrite: true, loadStart: '',
  tab: 'dash',
  dash: { preset: 'month', from: '', to: '', view: 'general' },
  pl: { mode: 'day', ref: today(), model: '' },
  sales: { date: today() },
  pay: { key: '' },
  attMonth: '',
  open: null
};
// points d'extension : une vue enregistre ses actions ici (HOOK.act.monAction = (el, e) => …) au lieu de modifier act()
const HOOK = { act: {}, seg: {}, change: [], input: [], toolsChange: [] };
try { const t = localStorage.getItem('kl_tab'); if (t) S.tab = t; const p = localStorage.getItem('kl_plmode'); if (p) S.pl.mode = p; } catch (e) {}

/* ================= référentiel ================= */
const sortedBy = (obj, f = 'name') => Object.entries(obj).map(([id, v]) => ({ id, ...v })).sort((a, b) => String(a[f] || '').localeCompare(String(b[f] || ''), 'fr'));
const activeChatters = () => sortedBy(S.chatters).filter(c => c.active !== false);
const colorIn = (obj, pal) => id => { const i = sortedBy(obj).findIndex(m => m.id === id); return pal[(i < 0 ? 0 : i) % pal.length]; };
const modelColor = id => colorIn(S.models, MODEL_COLORS)(id);
// OnlyFans orange, Telegram bleu, Uncove rouge (par nom), les autres prennent la palette
const PLAT_FIXED = [[/only ?fans|inflow/i, '#E5791F'], [/telegram|whysper/i, '#2D7FD3'], [/uncove/i, '#D63A3A'], [/twizz/i, '#8A5CD6']];
const platColor = id => { const n = S.platforms[id]?.name || ''; const f = PLAT_FIXED.find(([re]) => re.test(n)); return f ? f[1] : colorIn(S.platforms, PLAT_COLORS)(id); };
const chatterColor = id => colorIn(S.chatters, CHATTER_COLORS)(id);
const cName = id => S.chatters[id]?.name || 'Chatteur supprimé';
const mName = id => S.models[id]?.name || 'Modèle supprimée';
const pName = id => S.platforms[id]?.name || 'Plateforme';
const curOf = pid => S.platforms[pid]?.currency === 'EUR' ? 'EUR' : 'USD';
const initials = s => String(s || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
function accounts() {
  const out = [];
  sortedBy(S.models).filter(m => m.active !== false).forEach(m => (m.platforms || []).forEach(p => { if (S.platforms[p]) out.push({ key: m.id + '|' + p, modelId: m.id, platformId: p }); }));
  return out;
}
const splitAcct = k => { const [modelId, platformId] = k.split('|'); return { modelId, platformId }; };
// ordre d'affichage des comptes : par plateforme, puis par modèle
const acctCmp = (x, y) => { const a = splitAcct(x.key || x), b = splitAcct(y.key || y); return pName(a.platformId).localeCompare(pName(b.platformId), 'fr') || mName(a.modelId).localeCompare(mName(b.modelId), 'fr'); };
// options d'un menu de comptes groupées par plateforme
const acctOptions = (keys, sel) => [...keys].map(k => ({ k, a: splitAcct(k) })).sort((x, y) => mName(x.a.modelId).localeCompare(mName(y.a.modelId), 'fr') || pName(x.a.platformId).localeCompare(pName(y.a.platformId), 'fr'))
  .map(({ k, a }) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(mName(a.modelId))} · ${esc(pName(a.platformId))}</option>`).join('');
const acctHtml = (modelId, platformId) => `<span class="acct"><i style="background:${modelColor(modelId)}"></i>${esc(mName(modelId))} <small>${esc(pName(platformId))}</small></span>`;
const acctText = k => { const a = splitAcct(k); return `${mName(a.modelId)} ${pName(a.platformId)}`; };

/* ================= argent ================= */
// devise d'affichage : tout en €, sauf la page Paies (virements USDC, en $)
let BASE = 'EUR';
const fmtC = (n, cur = BASE, dec = 2) => {
  const v = (r2(n)).toLocaleString('fr-FR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  return cur === 'EUR' ? `${v} €` : `$${v}`;
};
const fmt0 = (n, cur = BASE) => fmtC(n, cur, 0);
const sym = cur => cur === 'EUR' ? '€' : '$';
const usd = (x, cur, rate = S.settings.eurUsd) => cur === 'EUR' ? x * num(rate) : x;
// montant converti dans la devise d'affichage (rate = combien de $ pour 1 €)
const toBase = (x, cur, rate = S.settings.eurUsd, base = BASE) => cur === base ? x : base === 'USD' ? x * num(rate) : x / (num(rate) || 1);
const pct = n => `${(Math.round(n * 10) / 10).toLocaleString('fr-FR')} %`;

function calc(e, rate, base = BASE) {
  const cur = e.cur || curOf(e.platformId);
  const fee = e.fee ?? num(S.platforms[e.platformId]?.fee ?? 20);
  const cr = e.rate ?? num(S.chatters[e.chatterId]?.rate ?? 10);
  // tapé en net (Twizz) : net = montant tapé, brut retrouvé avec les frais (0 % = brut égal au net)
  const isN = e.inp === 'net', k = isN && num(fee) < 100 ? 1 / (1 - num(fee) / 100) : 1;
  const sales = num(e.sales) * k, tips = num(e.tips) * k, gross = sales + tips;
  const net = isN ? num(e.sales) + num(e.tips) : gross * (1 - num(fee) / 100), com = net * num(cr) / 100;
  const b = x => toBase(x, cur, rate, base);
  return { cur, sales, tips, gross, net, com, grossU: b(gross), netU: b(net), comU: b(com), salesU: b(sales), tipsU: b(tips) };

        e.preventDefault(); const err = $('#lgErr', o), info = $('#lgInfo', o); err.hidden = info.hidden = true;
        const btn = $('button[type=submit]', o); btn.disabled = true;
        const email = e.target.email.value.trim(), password = e.target.pw.value;
        if (mode === 'in') {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          btn.disabled = false;
          if (error) { err.textContent = /confirm/i.test(error.message) ? 'Confirme d\'abord ton e-mail avec le lien reçu.' : 'E-mail ou mot de passe incorrect.'; err.hidden = false; return; }
          o.remove(); resolve();
        } else {
          const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
          btn.disabled = false;
          if (error) { err.textContent = error.message.includes('registered') ? 'Ce compte existe déjà : connecte-toi.' : 'Création impossible : ' + error.message; err.hidden = false; return; }
          if (data.session) { o.remove(); resolve(); return; }
          info.textContent = 'C\'est fait. Clique sur le lien reçu par e-mail pour confirmer, puis connecte-toi ici.'; info.hidden = false;
        }
      });
      setTimeout(() => { const i = $('#lgEmail', o); i && i.focus(); }, 50);
    };
    draw(); document.body.appendChild(o);
  });
}

// gestion des accès : les e-mails de kl_members peuvent se connecter et voir les données
async function accessModal(sb) {
  const me = ((await sb.auth.getUser()).data.user?.email || '').toLowerCase();
  const m = modal(`<div class="modal-h"><h2>Accès à l'app</h2><button class="btn ghost sm" type="button" data-close aria-label="Fermer">✕</button></div>
    <p class="muted" style="margin:0 0 12px">Ces adresses peuvent se connecter et voir les données, sauf les wallets : 💳 Wallets, c'est toi qui choisis. La personne crée ensuite son accès avec la même adresse sur l'écran de connexion (« Première fois ? Créer mon accès »).</p>
    <form id="accF" style="display:flex;gap:8px;margin-bottom:12px"><input id="accE" type="email" required placeholder="email@exemple.com" autocomplete="off" style="flex:1;min-width:0"><button class="btn primary" type="submit">Ajouter</button></form>
    <div id="accL" class="muted">Chargement…</div>
    <p class="hint" style="margin:12px 0 0">Clique sur un onglet pour l'ouvrir ou le fermer à la personne. 💳 Wallets : les adresses de paie des chatteurs, cachées partout (Équipe, Paies, fiche) pour qui ne l'a pas. Toi, tu gardes tout. Un onglet ouvert à tout le monde le sera aussi pour une nouvelle adresse ; un onglet que tu as restreint ne le sera pas.</p>`);
  let emails = [];
  const load = async () => {
    const { data, error } = await sb.rpc('kl_list_members');
    const box = $('#accL', m); if (!box) return;
    if (error) { box.textContent = 'Impossible de charger la liste.'; return; }
    box.className = '';
    emails = (data || []).map(r => (typeof r === 'string' ? r : r.kl_list_members));
    const has = (k, e) => e.toLowerCase() === me || !accList(k).length || accList(k).includes(e.toLowerCase());
    // 💳 Wallets : qui les voit (le propriétaire toujours) ; seul le propriétaire peut changer
    const wv = await sb.rpc('kl_wallet_viewers'); const wset = new Set((wv.data || []).map(r => String(typeof r === 'string' ? r : r.kl_wallet_viewers).toLowerCase()));
    const walB = e => wv.error ? '' : `<button type="button" class="acc-t acc-w" data-wal data-e="${esc(e)}" aria-pressed="${wset.has(e.toLowerCase())}" ${!S.isOwner || e.toLowerCase() === me ? 'disabled' : ''} title="${S.isOwner ? (e.toLowerCase() === me ? 'Toi, tu les vois toujours' : 'Voir les wallets des chatteurs') : 'Seul le propriétaire de l\'app choisit qui voit les wallets'}">💳 Wallets</button>`;
    box.innerHTML = emails.map(e => `<div class="acc-r"><div class="acc-h"><span>${esc(e)}${e.toLowerCase() === me ? ' <span class="muted">(toi)</span>' : ''}</span>${e.toLowerCase() === me ? '' : `<button class="btn sm" type="button" data-rm="${esc(e)}">Retirer</button>`}</div>
      <div class="acc-c" role="group" aria-label="Onglets de ${esc(e)}">${ACCESS_KEYS.map(([k, l]) => `<button type="button" class="acc-t" data-acc="${k}" data-e="${esc(e)}" aria-pressed="${has(k, e)}" ${e.toLowerCase() === me ? 'disabled' : ''}>${l}</button>`).join('')}${walB(e)}</div></div>`).join('');
  };
  $('#accF', m).onsubmit = async ev => {
    ev.preventDefault(); const inp = $('#accE', m); const e = inp.value.trim();
    const { error } = await sb.rpc('kl_add_member', { p_email: e });
    if (error) { toast(error.message || 'Ajout impossible', true); return; }
    inp.value = ''; toast(`${e} peut maintenant se connecter`); load();
  };
  // un clic sur un onglet l'ouvre ou le ferme à la personne ; on enregistre la liste complète par onglet (toi compris)
  m.addEventListener('click', async ev => {

let chartData = [], chartSeries = [], chartTip = null, chartTitle = null;
const niceStep = r => { const p = Math.pow(10, Math.floor(Math.log10(r || 1))); const m = r / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };

function barChart(data, series, title, tipExtra, tick, o = {}) {
  chartData = data; chartSeries = series; chartTip = tipExtra; chartTitle = title;
  const max = Math.max(1, ...data.map(x => x.total)); const step = niceStep(max / 4); const top = Math.ceil(max / step) * step;
  const W = o.W || 640, H = o.H || 220, L = 40, B = 24, R = 4, T = 8; const bw = (W - L - R) / data.length;

/* pénalités saisies sur Discord (bouton Pénalités de #gestion), en €, retirées de la paie de leur quinzaine */
// chatteur de l'app : lien posé par le bot, sinon son compte Discord relié, sinon son nom
function penChatter(p) {
  if (p.chatterId && S.chatters[p.chatterId]) return p.chatterId;
  const ids = Object.keys(S.chatters);
  const n = impNorm(p.name);
  return (p.uid && ids.find(k => S.chatters[k].discordId === p.uid)) || (n && ids.find(k => impNorm(S.chatters[k].name) === n)) || '';

// pénalités d'une quinzaine (date = jour de travail du bot, coupé à 02h01)
const penOf = key => Object.entries(S.penalties).map(([id, p]) => ({ ...p, id, cid: penChatter(p) })).filter(p => p.date && halfKey(p.date) === key).sort((a, b) => (a.at || 0) - (b.at || 0));

const penE = v => fmtC(v, 'EUR', v % 1 ? 2 : 0);

// montants d'une liste de pénalités ou de primes : en € par défaut, en $ si choisi sur Discord
const curOfP = p => p.currency === 'USD' ? 'USD' : 'EUR';
const curTot = l => { const t = { EUR: 0, USD: 0 }; l.forEach(p => { t[curOfP(p)] += num(p.amount); }); t.EUR = r2(t.EUR); t.USD = r2(t.USD); return t; };

const pAmt = p => fmtC(num(p.amount), curOfP(p), num(p.amount) % 1 ? 2 : 0);
// primes données sur Discord (🛠️ Admin › 💸 Primes), ajoutées à la paie de leur quinzaine
const primeOf = key => Object.entries(S.primes || {}).map(([id, p]) => ({ ...p, id, cid: penChatter(p) })).filter(p => p.date && halfKey(p.date) === key).sort((a, b) => (a.at || 0) - (b.at || 0));
// modèles choisies dans Paies (vide = toutes)
const payModels = () => (S.pay.models ??= lsGet('kl_pmodels', [])).filter(id => S.models[id]);
const paySel = () => { const v = payModels(); return v.length ? new Set(v) : null; };
const paySelName = () => payModels().map(mName).join(' + ');

function payData(key) {

  const pens = penOf(key), penBy = groupBy(pens, 'cid'), prs = primeOf(key), prBy = groupBy(prs, 'cid');
  const allBy = groupBy(all, 'chatterId'), by = groupBy(list, 'chatterId');
  const ids = new Set(Object.keys(by)); if (!sel) prs.forEach(p => { if (p.cid && S.chatters[p.cid]) ids.add(p.cid); });
  const rows = [...ids].map(id => {
    const l = by[id] || [], la = allBy[id] || [], s = agg(l, rate, 'USD'), it = po.items?.[id] || {};
    const fullByM = {}; Object.entries(groupBy(la, 'modelId')).forEach(([m, x]) => { fullByM[m] = r2(agg(x, rate, 'USD').com); });
    const byM = Object.entries(groupBy(l, 'modelId')).map(([m, x]) => ({ m, com: r2(agg(x, rate, 'USD').com) })).sort((a, b) => b.com - a.com);

  }).sort((a, b) => b.total - a.total);

}

async function exportCsv() {

function teamOrder(cs) {

  const lbl = k => k === 99 ? 'Inactifs' : k < SLOTS.length ? `${slotPill(SLOTS[k].k)} <span class="muted" style="text-transform:none;letter-spacing:0">${SLOTS[k].h}</span>` : 'Sans shift habituel';
  let last = null;
  return [...cs].sort((a, b) => g(a) - g(b) || String(a.name).localeCompare(String(b.name), 'fr')).map(c => { const k = g(c); const head = k !== last ? lbl(k) : ''; last = k; return { c, head }; });
}
// par modèle : les modèles de son shift habituel (un chatteur sur deux modèles apparaît dans les deux), du matin à la nuit
function teamOrderByModel(cs) {

// remplace les shifts du chatteur par son shift habituel (un ou deux créneaux), d'aujourd'hui à la fin de la semaine prochaine ;
// un créneau qu'il garde garde sa ligne et ses box (sauf sur les modèles qu'il n'a plus)
async function applyHabit(cid, shift) {
  const from = today(), to = addDays(monday(from), 13);
  const slots = habSlots(shift), mids = new Set((shift?.accts || []).map(k => splitAcct(k).modelId));
  for (const d of daysIn(from, to)) {
    const patch = {}; const wd = (parse(d).getDay() + 6) % 7;
    const want = shift && (shift.days || []).includes(wd) && !isOff(cid, d) ? slots : [];
    const mine = planOf(d).filter(s => s.chatterId === cid);
    mine.forEach(s => {
      if (!want.includes(s.slot) || mine.find(x => x.slot === s.slot) !== s) { patch[s.sid] = null; return; }
      const gone = Object.keys(s.boxes || {}).filter(m => !mids.has(m));
      patch[s.sid] = { accts: shift.accts, ...(gone.length ? { boxes: Object.fromEntries(gone.map(m => [m, null])) } : {}) };
    });
    want.filter(k => !mine.some(s => s.slot === k)).forEach(k => { patch[uid()] = { slot: k, chatterId: cid, accts: shift.accts }; });
    if (Object.keys(patch).length) await writeMap('plan', d, 'shifts', patch);
  }
}
async function fillHabit() {
  const m = monday(S.pl.ref); const days = daysIn(m, addDays(m, 6)); let n = 0;
  const ok = await guard(async () => {
    for (const d of days) {
      const wd = (parse(d).getDay() + 6) % 7; const patch = {}; const p = planOf(d);
      activeChatters().forEach(c => { const h = c.shift; if (!habSlots(h).length || !(h.days || []).includes(wd) || isOff(c.id, d)) return; habSlots(h).forEach(k => { if (p.some(s => s.chatterId === c.id && s.slot === k)) return; patch[uid()] = { slot: k, chatterId: c.id, accts: h.accts || [] }; n++; }); });
      if (Object.keys(patch).length) await writeMap('plan', d, 'shifts', patch);
    }
  });
  if (ok) toast(n ? `${n} shift${n > 1 ? 's' : ''} ajouté${n > 1 ? 's' : ''} depuis les shifts habituels` : 'La semaine contient déjà tous les shifts habituels');
}

let lastFocus = null;
function modal(html, size = '') {
  closeModal(true); lastFocus = document.activeElement;
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener('mousedown', e => { if (e.target === o) closeModal(); });
  o.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
  $('#layer').appendChild(o);
  setTimeout(() => { const f = o.querySelector('input:not([type=checkbox]):not([disabled]),select:not([disabled])'); f && f.focus(); });
  return o;
}
function closeModal(silent) { $('#layer').innerHTML = ''; if (!silent && lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {} }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#layer').firstChild) closeModal(); });
function confirmBox(title, text, label, fn) {
  const m = modal(`<div class="modal-h"><h2>${esc(title)}</h2></div><p style="margin:0" class="muted">${esc(text)}</p><div class="modal-f"><button class="btn" type="button" data-close>Annuler</button><button class="btn primary" type="button" data-ok style="background:var(--bad);border-color:var(--bad);color:#fff">${esc(label)}</button></div>`, 'sm');
  $('[data-ok]', m).onclick = async () => { const ok = await fn(); if (ok !== false) closeModal(); };
}
let toastT = 0;
function toast(msg, err) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200);
}

async function copyWeek() {
  const m = monday(S.pl.ref); const days = daysIn(m, addDays(m, 6));
  const has = days.some(d => planOf(d).length);

// hauteur de la grille calée sur la vraie barre du haut ; ombre de défilement des rangées de filtres
function plFit() {
  const v = $('#view'); if (!v) return;
  const sc = v.querySelector('.pl-scroll');
  if (sc) {
    if (window.innerWidth <= 700) sc.style.maxHeight = 'none';
    else {

    upd(); el.addEventListener('scroll', upd, { passive: true });

}

// numéro de semaine ISO
function plWeekNo(s) {
  const d = parse(s); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const wd = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - wd);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}
const plS = n => n > 1 ? 's' : '';
const plWd = d => (parse(d).getDay() + 6) % 7;
// étiquette compte compacte : pastille modèle + nom + plateforme teintée
const plAcct = k => { const a = splitAcct(k); return `<span class="pl-ab" title="${esc(mName(a.modelId) + ' · ' + pName(a.platformId))}"><i style="background:${modelColor(a.modelId)}"></i>${esc(mName(a.modelId))}<b style="--c:${platColor(a.platformId)}">${esc(pName(a.platformId))}</b></span>`; };
// comptes regroupés par modèle : « ● Axelle [Twizz][Telegram] »
// btn(mid) : attributs d'un bouton (le modèle devient cliquable, ▾)
function plAcctGroup(keys, btn) {
  const by = groupBy((keys || []).map(splitAcct), 'modelId');
  return Object.entries(by).map(([mid, l]) => { const inner = `<i style="background:${modelColor(mid)}"></i><span class="pl-agb"><span class="pl-agn">${esc(mName(mid))}</span>${l.map(a => `<b class="pl-pb" style="--c:${platColor(a.platformId)}"><span class="pl-pbl">${esc(pName(a.platformId))}</span><span class="pl-pbs" aria-hidden="true">${esc(plCode(a.platformId))}</span></b>`).join('')}</span>`;
    return btn ? `<button type="button" class="pl-ag pl-agm" ${btn(mid)}>${inner}<svg class="pl-agc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>` : `<span class="pl-ag" title="${esc(mName(mid) + ' : ' + l.map(a => pName(a.platformId)).join(', '))}">${inner}</span>`; }).join('');
}
// code court et unique d'une plateforme (OnlyFans → OF, Telegram → TE), pour les petits écrans
function plCode(pid) {
  const base = n => { n = String(n || ''); const caps = n.match(/[A-Z0-9]/g) || []; return caps.length >= 2 ? caps.join('') : n.replace(/[^A-Za-zÀ-ÿ0-9]/g, ''); };
  const names = sortedBy(S.platforms).map(p => p.name); const me = base(pName(pid));
  for (let len = 2; len <= 4; len++) { const c = me.slice(0, len).toUpperCase(); if (names.filter(n => base(n).slice(0, len).toUpperCase() === c).length <= 1) return c || '?'; }
  return me.slice(0, 4).toUpperCase() || '?';
}
// pointage dans les grilles : rien pour « présent », pastille lettrée pour un incident
const plStTag = st => st && st !== 'present' && STATUS[st] ? `<em class="pl-stt" style="--c:var(--${STATUS[st][1]})" title="${STATUS[st][0]}">${STATUS[st][0][0]}</em>` : '';
const plStTxt = st => st && st !== 'present' && STATUS[st] ? ` (${STATUS[st][0].toLowerCase()})` : '';

// shifts habituels des chatteurs actifs : pour chaque jour de semaine (0 = lundi), les couples « créneau|compte » attendus
function plHabits() {
  const keys = new Set(accounts().map(a => a.key)); const out = Array.from({ length: 7 }, () => new Set());
  activeChatters().forEach(c => { const h = c.shift; habSlots(h).forEach(sl => (h.days || []).forEach(wd => { if (out[wd]) (h.accts || []).forEach(k => { if (keys.has(k)) out[wd].add(sl + '|' + k); }); })); });
  return out;
}

// données de la semaine : plans, couverture par jour × créneau × compte, créneaux attendus
function plWeekData(ref) {
  const m = monday(ref); const days = daysIn(m, addDays(m, 6));
  const f = S.pl.model || '', fp = S.pl.plat || '';
  const okA = k => { const a = splitAcct(k); return (!f || a.modelId === f) && (!fp || a.platformId === fp); };
  const all = accounts(); const accts = all.filter(a => okA(a.key));
  const plans = Object.fromEntries(days.map(d => [d, planOf(d)]));
  const empty = !days.some(d => plans[d].length);
  const cover = {};
  days.forEach(d => { cover[d] = {}; SLOTS.forEach(sl => { cover[d][sl.k] = {}; }); plans[d].forEach(s => { if (!cover[d][s.slot]) return; (s.accts || []).forEach(k => (cover[d][s.slot][k] ||= []).push(s)); }); });
  // attendu = couple créneau × compte tenu au moins un jour de la semaine, ou prévu par un shift habituel ce jour-là
  const hab = plHabits(); const planR = new Set();
  days.forEach(d => SLOTS.forEach(sl => Object.keys(cover[d][sl.k]).forEach(k => planR.add(sl.k + '|' + k))));
  const want = (d, sl, k) => planR.has(sl + '|' + k) || hab[plWd(d)].has(sl + '|' + k);
  const routine = new Set(planR); days.forEach(d => hab[plWd(d)].forEach(x => routine.add(x)));
  const used = new Set([...routine].map(x => x.slice(x.indexOf('|') + 1)));
  Object.values(plans).flat().forEach(s => (s.accts || []).forEach(k => used.add(k)));
  // un compte est couvert si au moins un chatteur présent (pas en day off) le tient
  const okOn = (d, sl, k) => (cover[d][sl][k] || []).some(s => !isOff(s.chatterId, d));
  const isGap = (d, sl, k) => want(d, sl, k) && !okOn(d, sl, k);
  const watch = accts.filter(a => used.has(a.key));
  // avec un filtre, day off et incidents ne comptent que les chatteurs concernés (shift de la semaine ou compte habituel filtré)
  const chat = new Set(Object.values(plans).flat().filter(s => (s.accts || []).some(okA)).map(s => s.chatterId));
  const inScope = id => !(f || fp) || chat.has(id) || (S.chatters[id]?.shift?.accts || []).some(okA);
  return { m, days, f, fp, okA, all, accts, plans, used, cover, watch, routine, want, okOn, isGap, empty, inScope };
}

function planWeek() {
  const W = plWeekData(S.pl.ref); const { days, okA, plans, watch, isGap, empty } = W;
  const P = S.pl; const filt = W.f || W.fp;
  const shifts = Object.values(plans).flat().filter(s => (s.accts || []).some(okA));
  const chat = new Set(shifts.map(s => s.chatterId));
  let holes = 0;
  days.forEach(d => SLOTS.forEach(sl => watch.forEach(a => { if (isGap(d, sl.k, a.key)) holes++; })));
  const inScope = W.inScope;
  const offs = days.flatMap(d => offsOn(d)).filter(o => S.chatters[o.chatterId] && inScope(o.chatterId));
  const att = attIn(days[0], days[6]).filter(a => S.chatters[a.chatterId] && (!filt || (plans[a.date] || []).some(s => s.chatterId === a.chatterId && s.slot === a.slot && (s.accts || []).some(okA))));
  const inc = att.filter(a => a.status !== 'present');
  const incTxt = ['retard', 'coupure', 'absent'].map(k => { const n = inc.filter(a => a.status === k).length; return n ? `${n} ${STATUS[k][0].toLowerCase()}${plS(n)}` : ''; }).filter(Boolean).join(' · ');
  const offWho = [...new Set(offs.map(o => cName(o.chatterId)))];
  let h = tiles([
    tile('Shifts', shifts.length, shifts.length ? `${chat.size} chatteur${plS(chat.size)} sur la semaine` : 'Aucun shift planifié', { c: 'var(--s3)', icon: 'calendar' }),

  h += plToolbar(W);
  if (empty) h += plEmptyWeek(W);

// en-tête de jour : date, couverture des 4 créneaux, chatteurs en day off
function plDayHead(W, d) {

// vue « Par compte » : lignes = modèles > comptes, colonnes = jours, 4 créneaux par case
function plByAcct(W) {
  const { days, accts, cover, used, isGap, want, empty } = W; const P = S.pl; const td = today();
  if (!accts.length) return `<div class="card empty"><h3>Aucun compte pour ce filtre</h3><p>Change le filtre modèle ou plateforme.</p><div class="acts"><button class="btn" type="button" data-act="plClearF">Effacer les filtres</button></div></div>`;

  models.forEach(mo => {
    const list = byM[mo.id]; const fold = P.fold?.[mo.id]; const mc = modelColor(mo.id);
    const g = list.map(a => days.reduce((n, d) => n + SLOTS.filter(sl => isGap(d, sl.k, a.key)).length, 0));

    const pill = empty || !list.some(a => used.has(a.key)) ? '<span class="pill mute">Pas planifiée</span>' : gaps ? `<span class="pill warn">${gaps} à couvrir</span>` : '<span class="pill good">Complet</span>';
    h += `<tr class="pl-g" style="--m:${mc}"><td colspan="8"><button type="button" class="pl-gh" data-act="plFold" data-id="${mo.id}" aria-expanded="${!fold}">
      <svg class="pl-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      <i class="pl-mdot"></i><b>${esc(mo.name)}</b><span class="pl-gn">${list.length} compte${plS(list.length)}</span>${pill}
    </button></td></tr>`;
    if (fold) return;
    list.forEach((a, i) => {
      const cur = curOf(a.platformId);
      const st = empty || !used.has(a.key) ? '' : g[i] ? `<div class="pl-acc-s w">${g[i]} à couvrir</div>` : `<div class="pl-acc-s ok">${IC.check}Complet</div>`;
      h += `<tr class="pl-r ${i === list.length - 1 ? 'last' : ''}" style="--m:${mc}"><th class="pl-acc" scope="row"><div class="pl-acc-m" title="${esc(mo.name)}"><i></i><span>${esc(mo.name)}</span></div><div class="pl-acc-in">${platBadge(a.platformId)}<span class="pl-cur" title="${cur === 'EUR' ? 'En euros' : 'En dollars'}">${sym(cur)}</span></div>${st}</th>`;
      days.forEach(d => {
        h += `<td class="${d === td ? 'today' : ''} ${d < td ? 'past' : ''}"><div class="pl-cell">${SLOTS.map(sl => { const l = cover[d][sl.k][a.key] || []; return plLine(d, sl, a.key, l, l.length ? 'on' : want(d, sl.k, a.key) ? (empty ? 'todo' : 'gap') : 'free'); }).join('')}</div></td>`;
      });
      h += '</tr>';
    });
  });
  h += `</tbody></table></div><p class="hint mt">Clique sur une ligne de créneau pour choisir qui couvre ce compte. Les lignes pâles ne sont tenues par personne cette semaine.</p>`;
  return h;
}
function plLine(d, sl, key, list, kind) {
  const a = splitAcct(key); const where = `${sl.l} ${dShort(d)} · ${mName(a.modelId)} ${pName(a.platformId)}`;
  let body, lbl;
  if (kind === 'on') {
    if (list.every(s => isOff(s.chatterId, d))) kind = 'on offall';
    body = `<span class="pl-names">${list.map(s => { const c = S.chatters[s.chatterId]; const off = isOff(s.chatterId, d);
      return `<span class="pl-n ${off ? 'off' : ''} ${c && c.active === false ? 'ina' : ''}">${esc(cName(s.chatterId))}${plStTag(attOf(d, s.slot, s.chatterId)?.status)}</span>`; }).join('<span class="pl-sep">, </span>')}</span>`;
    lbl = list.map(s => cName(s.chatterId) + (isOff(s.chatterId, d) ? ' (day off)' : '') + plStTxt(attOf(d, s.slot, s.chatterId)?.status)).join(', ');
  } else if (kind === 'gap') { body = '<span class="pl-gapt">à couvrir</span>'; lbl = 'à couvrir'; }
  else if (kind === 'todo') { body = '<span class="pl-todot">à planifier</span>'; lbl = 'à planifier'; }
  else { body = '<span class="pl-plus" aria-hidden="true">+</span>'; lbl = 'personne'; }
  return `<button type="button" class="pl-ln ${kind}" style="--c:${slotVar(sl.k)}" data-act="plCell" data-date="${d}" data-slot="${sl.k}" data-acct="${key}" title="${esc(where + ' : ' + lbl)}" aria-label="${esc(where + ' : ' + lbl)}"><b>${sl.l[0]}</b>${body}</button>`;
}

// vue « Par chatteur » : lignes = chatteurs groupés par shift habituel, colonnes = jours
function plByChat(W) {
  const { days, okA, plans } = W; const td = today(); const filt = W.f || W.fp;
  const inWeek = id => days.some(d => plans[d].some(s => s.chatterId === id && (s.accts || []).some(okA)));
  const rows = sortedBy(S.chatters).filter(c => {
    if (c.active === false) return inWeek(c.id);
    if (!filt) return true;
    return inWeek(c.id) || (c.shift?.accts || []).some(okA);
  }).map(c => ({ c, g: c.active === false ? 99 : slotIdx(habSlot(c)) }));
  rows.sort((a, b) => a.g - b.g || String(a.c.name || '').localeCompare(String(b.c.name || ''), 'fr'));
  if (!rows.length) return `<div class="card empty"><h3>Aucun chatteur pour ce filtre</h3><p>Change le filtre modèle ou plateforme.</p><div class="acts"><button class="btn" type="button" data-act="plClearF">Effacer les filtres</button></div></div>`;
  let h = plLegend(false, W);
  h += `<div class="pl-scroll"><table class="pl-wk pl-wkc"><thead><tr><th class="pl-corner" scope="col"><span>Chatteur</span></th>${days.map(d => plDayHead(W, d)).join('')}</tr></thead><tbody>`;
  let last = null;
  rows.forEach(({ c, g }) => {
    if (g !== last) {
      const n = rows.filter(r => r.g === g).length;
      const lab = g === 99 ? '<span class="pl-gl">Inactifs</span>' : g < SLOTS.length ? `${slotPill(SLOTS[g].k)}<span class="pl-gn">${SLOTS[g].h}</span>` : '<span class="pl-gl">Sans shift habituel</span>';
      h += `<tr class="pl-g pl-gs"><td colspan="8"><div class="pl-gh static">${lab}<span class="pl-gn">${n} chatteur${plS(n)}</span></div></td></tr>`; last = g;
    }
    const act = c.active !== false; const nAcc = (c.shift?.accts || []).length; const nm = cName(c.id);
    const hl = habSlots(c.shift).length ? habSlots(c.shift) : ['matin'];
    const order = [...hl, ...SLOTS.map(x => x.k).filter(k => !hl.includes(k))];
    h += `<tr class="pl-r ${act ? '' : 'ina'}"><th class="pl-acc pl-who" scope="row">${whoHtml(c.id, !act ? 'Inactif' : nAcc ? `${nAcc} compte${plS(nAcc)} habituel${plS(nAcc)}` : 'Pas de compte habituel', true)}</th>`;
    days.forEach(d => {
      const off = isOff(c.id, d);
      const all = plans[d].filter(s => s.chatterId === c.id);
      const mine = all.slice().sort((x, y) => slotIdx(x.slot) - slotIdx(y.slot)).map(s => ({ s, ac: (s.accts || []).filter(okA) })).filter(x => !filt || x.ac.length);
      const taken = new Set(all.map(s => s.slot)); const free = order.find(k => !taken.has(k));
      let cell = off ? '<span class="pl-offc">Day off</span>' : '';
      cell += mine.map(({ s, ac }) => {
        const same = g < SLOTS.length && s.slot === SLOTS[g].k; const st = attOf(d, s.slot, c.id)?.status;
        const lbl = `${nm} · ${slotL(s.slot)} ${dShort(d)}${ac.length ? ' · ' + ac.map(acctText).join(', ') : ''}${plStTxt(st)}${off ? ' · en day off' : ''}`;
        return `<button type="button" class="pl-sh ${off ? 'off' : ''} ${plStTag(st) ? 'has-st' : ''}" style="--c:${slotVar(s.slot)}" data-act="plCell" data-date="${d}" data-slot="${esc(s.slot || '')}" data-c="${c.id}" title="${esc(lbl)}" aria-label="${esc(lbl)}">${same ? '' : `<span class="pl-sht">${esc(slotL(s.slot))}</span>`}<span class="pl-shacc">${ac.length ? plAcctGroup(ac) : '<span class="muted">aucun compte</span>'}</span>${plStTag(st)}</button>`;
      }).join('');
      if (act && free) cell += !mine.length && !off
        ? `<button type="button" class="pl-add" data-act="plCell" data-date="${d}" data-slot="${free}" data-c="${c.id}" aria-label="${esc(`Planifier ${nm} le ${dShort(d)}`)}">+</button>`
        : `<button type="button" class="pl-add mini" data-act="plCell" data-date="${d}" data-slot="${free}" data-c="${c.id}" title="${esc(`Ajouter un créneau (${slotL(free)})`)}" aria-label="${esc(`Ajouter un créneau ${slotL(free)} à ${nm} le ${dShort(d)}`)}">+</button>`;
      h += `<td class="${d === td ? 'today' : ''} ${d < td ? 'past' : ''}"><div class="pl-cc">${cell}</div></td>`;
    });
    h += '</tr>';
  });
  h += `</tbody></table></div><p class="hint mt">Les chatteurs sont rangés par shift habituel. Clique sur un créneau pour le modifier, ou sur + pour en ajouter un.</p>`;
  return h;
}

/* ---------- fenêtre d'un créneau ---------- */
function slotModal(date, slot, acct, cid) {
  const sl = SLOTS.find(s => s.k === slot) || SLOTS[0]; slot = sl.k;
  const accts = accounts(); const aKeys = new Set(accts.map(a => a.key));
  const habAll = id => (S.chatters[id]?.shift?.accts || []).filter(k => aKeys.has(k));
  const habit = id => habSlots(S.chatters[id]?.shift).includes(slot) ? habAll(id) : [];
  const rows = planOf(date).filter(s => s.slot === slot).map(s => ({ chatterId: s.chatterId, accts: [...(s.accts || [])] }));
  // la ligne demandée (chatteur ou compte cliqué) passe en premier
  const hit = rows.findIndex(r => cid ? r.chatterId === cid : !!acct && r.accts.includes(acct));
  if (hit < 0 && (cid || acct)) rows.unshift({ chatterId: cid || '', accts: acct ? [acct] : cid ? habit(cid) : [], asked: true });
  else if (hit >= 0) { const r = rows.splice(hit, 1)[0]; r.asked = true; rows.unshift(r); }
  if (!rows.length) rows.push({ chatterId: '', accts: [] });
  const W = plWeekData(date); const week = W.days;
  const expected = accts.filter(a => W.want(date, slot, a.key));
  const models = sortedBy(S.models).filter(x => x.active !== false && accts.some(a => a.modelId === x.id));
  const many = models.length > 3;
  const dayPlan = planOf(date);
  const optTxt = c => { const o = dayPlan.filter(s => s.chatterId === c.id && s.slot !== slot); return c.name + (isOff(c.id, date) ? ' · day off' : '') + (o.length ? ' · déjà ' + o.map(s => slotL(s.slot)).join(', ') : ''); };
  const opts = sel => {
    const act = activeChatters();
    const groups = [...SLOTS.map(s => [s.k, s.l]), ['', 'Sans shift habituel']];
    const g = groups.map(([k, l]) => { const cs = act.filter(c => habSlot(c) === k); return cs.length ? `<optgroup label="${esc(l)}">${cs.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(optTxt(c))}</option>`).join('')}</optgroup>` : ''; }).join('');
    const extra = sel && !act.some(c => c.id === sel) ? `<option value="${sel}" selected>${esc(cName(sel))} (inactif)</option>` : '';
    return `<option value="">Choisir un chatteur…</option>${extra}${g}`;
  };
  const m = modal(`<div class="modal-h pl-mh"><div class="pl-mht"><div class="pl-slotsw" role="group" aria-label="Créneau">${SLOTS.map(s => `<button type="button" data-slotsw="${s.k}" aria-pressed="${s.k === slot}" style="--c:${slotVar(s.k)}" title="${s.l} ${s.h}"><b aria-hidden="true">${s.l[0]}</b>${s.l}</button>`).join('')}</div><h2>${cap(dLong(date))} <span class="pl-mhh">${sl.l} · ${sl.h}</span></h2></div><button class="icon-btn" type="button" data-close aria-label="Fermer">${ICONS.x}</button></div>
    <div id="plNeed"></div>
    <div id="arows" class="pl-rows"></div>
    <button class="pl-addrow" type="button" data-addrow>+ Ajouter un chatteur sur ce créneau</button>
    <div class="pl-rep"><div class="pl-sub">Appliquer aussi ce créneau à d'autres jours</div><div class="pl-days" id="repDays"><label class="all"><input type="checkbox" name="repall">Toute la semaine</label>${week.map(d => `<label class="${d === date ? 'cur' : ''}"><input type="checkbox" name="rep" value="${d}" ${d === date ? 'checked disabled' : ''}>${esc(fd(d, { weekday: 'short' }).replace('.', ''))} <b>${parse(d).getDate()}</b></label>`).join('')}</div><p class="hint">Les jours cochés reçoivent exactement les mêmes chatteurs et comptes sur ce créneau.</p></div>
    <div class="modal-f pl-mf"><span class="hint left">Une ligne sans chatteur ou sans compte n'est pas enregistrée.</span><button class="btn" type="button" data-close>Annuler</button><button class="btn primary" type="button" data-save>Enregistrer</button></div>`, 'pl-modal');
  const box = $('#arows', m);
  const need = () => {
    const got = new Set(); rows.filter(r => r.chatterId && !isOff(r.chatterId, date)).forEach(r => r.accts.forEach(k => got.add(k)));
    const miss = expected.filter(a => !got.has(a.key));
    $('#plNeed', m).innerHTML = miss.length ? `<div class="pl-msg warn">${IC.alert}<div><b>${miss.length} compte${plS(miss.length)} habituel${plS(miss.length)} sans chatteur sur ce créneau</b><div class="pl-msg-l">${plAcctGroup(miss.map(a => a.key))}</div></div></div>`
      : expected.length ? `<div class="pl-msg good">${IC.check}<span>Tous les comptes habituels de ce créneau sont couverts.</span></div>` : '';
  };
  // modèles affichées dans une ligne : celles déjà cochées ou habituelles du chatteur (toutes sur demande)
  const msOf = r => { if (!r.ms) r.ms = new Set(); r.accts.forEach(k => r.ms.add(splitAcct(k).modelId)); if (r.chatterId) habAll(r.chatterId).forEach(k => r.ms.add(splitAcct(k).modelId)); return r.ms; };
  const rowHtml = (r, i) => {
    const c = S.chatters[r.chatterId]; const off = r.chatterId && isOff(r.chatterId, date);
    const other = r.chatterId ? dayPlan.filter(s => s.chatterId === r.chatterId && s.slot !== slot) : [];
    const hab = r.chatterId ? habAll(r.chatterId) : [];
    const hbSl = habSlots(c?.shift), hbSlot = hbSl.includes(slot) ? '' : hbSl[0];
    const ms = msOf(r); const showAll = !many || r.all || !ms.size;
    const vis = showAll ? models : models.filter(mo => ms.has(mo.id));
    const hidN = accts.filter(a => !vis.some(mo => mo.id === a.modelId)).length;
    return `<div class="pl-arow ${off ? 'is-off' : ''}" data-i="${i}">
      <div class="pl-arow-h">${r.chatterId ? `<span class="av sm" style="background:${chatterColor(r.chatterId)}">${esc(initials(cName(r.chatterId)))}</span>` : '<span class="av sm pl-av0">?</span>'}
        <select data-f="c" aria-label="Chatteur">${opts(r.chatterId)}</select>
        ${hab.length ? `<button class="btn sm pl-habit" type="button" data-habit title="Cocher ses comptes habituels"><span class="pl-hl">Comptes habituels</span><span class="pl-hs">Habituels</span></button>` : ''}
        <button class="icon-btn" type="button" data-rm aria-label="Retirer ce chatteur du créneau">${ICONS.trash}</button></div>
      <div class="pl-agrid">${vis.map(mo => `<div class="pl-am"><span class="md" title="${esc(mo.name)}"><i style="background:${modelColor(mo.id)}"></i><span class="pl-amn">${esc(mo.name)}</span></span><div class="pl-ap">${accts.filter(a => a.modelId === mo.id).map(a => `<label class="pl-chip" style="--c:${platColor(a.platformId)}"><input type="checkbox" data-f="a" value="${a.key}" ${r.accts.includes(a.key) ? 'checked' : ''}><span>${esc(pName(a.platformId))}</span><small>${sym(curOf(a.platformId))}</small></label>`).join('')}</div></div>`).join('')}</div>
      ${many && ms.size ? `<button type="button" class="pl-allacc" data-allacc aria-expanded="${showAll}">${showAll ? 'Réduire la liste des comptes' : `Afficher tous les comptes (+${hidN})`}</button>` : ''}
      ${off ? `<div class="pl-msg bad">${IC.alert}<span><b>${esc(cName(r.chatterId))}</b> est en day off ce jour-là : ses comptes restent à couvrir.</span></div>` : ''}
      ${c && c.active === false ? `<div class="pl-msg warn">${IC.alert}<span>${esc(c.name)} est marqué inactif dans Équipe.</span></div>` : ''}
      ${other.length ? `<div class="pl-msg info">${IC.clock}<span>Aussi planifié ce jour : ${other.map(s => slotPill(s.slot)).join(' ')}</span></div>` : ''}
      ${r.chatterId && hbSlot && hbSlot !== slot && !other.length ? `<div class="pl-msg mute">${IC.calendar}<span>Son shift habituel : ${hbSl.map(slotPill).join('')}</span></div>` : ''}
    </div>`;
  };
  const draw = () => { box.innerHTML = rows.map(rowHtml).join(''); need(); };
  draw();
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-slotsw]'); if (!b || b.dataset.slotsw === slot) return;
    // on garde le chatteur demandé (ou choisi dans la ligne demandée) et le compte cliqué
    slotModal(date, b.dataset.slotsw, acct, cid || (rows[0]?.asked ? rows[0].chatterId : '') || '');
  });
  $('#repDays', m).addEventListener('change', e => { const all = $('input[name=repall]', m); const ds = $$('input[name=rep]:not(:disabled)', m); if (e.target === all) ds.forEach(x => x.checked = all.checked); else all.checked = ds.every(x => x.checked); });
  box.addEventListener('change', e => {
    const row = e.target.closest('.pl-arow'); if (!row) return; const r = rows[+row.dataset.i];
    if (e.target.dataset.f === 'c') { r.chatterId = e.target.value; r.ms = null; if (r.chatterId && !r.accts.length) r.accts = habit(r.chatterId); draw(); const s = $(`.pl-arow[data-i="${row.dataset.i}"] select`, m); s && s.focus(); }
    else { r.accts = $$('input[data-f=a]:checked', row).map(x => x.value); need(); }
  });
  box.addEventListener('click', e => {
    const row = e.target.closest('.pl-arow'); if (!row) return; const i = +row.dataset.i;
    if (e.target.closest('[data-rm]')) { rows.splice(i, 1); if (!rows.length) rows.push({ chatterId: '', accts: [] }); draw(); }
    else if (e.target.closest('[data-habit]')) { rows[i].accts = habAll(rows[i].chatterId); draw(); }
    else if (e.target.closest('[data-allacc]')) { rows[i].all = !(rows[i].all || !msOf(rows[i]).size); draw(); const t = $(`.pl-arow[data-i="${i}"] [data-allacc]`, m); t && t.focus(); }
  });
  $('[data-addrow]', m).onclick = () => { rows.push({ chatterId: '', accts: [] }); draw(); const s = $$('.pl-arow select', m).pop(); s && s.focus(); };
  $('[data-save]', m).onclick = async () => {
    const merged = {}; rows.filter(r => r.chatterId && r.accts.length).forEach(r => { merged[r.chatterId] = [...new Set([...(merged[r.chatterId] || []), ...r.accts])]; });
    const valid = Object.entries(merged).map(([chatterId, a]) => ({ chatterId, accts: a }));
    const targets = [date, ...$$('input[name=rep]:checked:not(:disabled)', m).map(x => x.value)];
    const ok = await guard(async () => {
      for (const d of targets) {
        const patch = {}, ob = {}; planOf(d).filter(s => s.slot === slot).forEach(s => { patch[s.sid] = null; if (s.boxes) ob[s.chatterId] = { ...(ob[s.chatterId] || {}), ...s.boxes }; });
        valid.forEach(r => patch[uid()] = { slot, chatterId: r.chatterId, accts: r.accts, ...keepBoxes(ob[r.chatterId], r.accts) });
        await writeMap('plan', d, 'shifts', patch);
      }
    }, targets.length > 1 ? `Créneau enregistré sur ${targets.length} jours` : 'Planning enregistré');
    if (ok) closeModal();
  };
}

/* ---------- day off ---------- */
function planOffs() {
  const ms = monthStart(S.pl.ref), me = monthEnd(ms); const q = num(S.settings.dayOffQuota) || 3; const td = today();
  // les day off d'un chatteur supprimé restent visibles (et supprimables)
  const offs = Object.entries(S.offs).map(([id, o]) => ({ id, ...o })).filter(o => o && o.date >= ms && o.date <= me).sort((a, b) => a.date.localeCompare(b.date) || String(cName(a.chatterId)).localeCompare(String(cName(b.chatterId)), 'fr'));
  const defDate = td >= ms && td <= me ? td : ms;
  const shOf = o => planOf(o.date).filter(s => s.chatterId === o.chatterId).sort((a, b) => slotIdx(a.slot) - slotIdx(b.slot));
  const todo = offs.filter(o => shOf(o).length).length;
  const onlyTodo = !!S.pl.offTodo && todo > 0;
  const qc = n => n > q ? 'bad' : n === q ? 'warn' : 'info';
  const cur = td >= ms && td <= me; const showPast = !cur || S.pl.offPast || onlyTodo;
  const past = offs.filter(o => o.date < td).length;
  const shown = onlyTodo ? offs.filter(o => shOf(o).length) : showPast ? offs : offs.filter(o => o.date >= td);
  let prevD = '';
  const list = shown.map(o => {
    const same = o.date === prevD; prevD = o.date;
    const sh = shOf(o);
    return `<div class="pl-or ${same ? 'same' : ''} ${sh.length ? 'todo' : ''} ${o.date < td ? 'past' : ''} ${o.date === td ? 'today' : ''}">
      <div class="pl-date"><span>${esc(fd(o.date, { weekday: 'short' }).replace('.', ''))}</span><b>${parse(o.date).getDate()}</b></div>
      <div class="pl-or-who">${whoHtml(o.chatterId, [esc(offScopeText(offScope(o.chatterId, o.date, o))), o.note ? esc(o.note) : '', `${offsCount(o.chatterId, ms)}/${q} ce mois`].filter(Boolean).join(' · '), true)}</div>
      <div class="pl-or-st">${sh.length ? `<span class="pill bad">À remplacer</span><div class="pl-or-sh">${sh.map(s => `<span class="pl-or-l">${slotPill(s.slot)}${plAcctGroup(s.accts || [])}</span>`).join('')}</div>` : `<span class="pl-ok">${IC.check}Planning OK</span>`}</div>
      <div class="pl-or-act">${sh.length ? `<button class="btn sm" type="button" data-act="offclear" data-id="${o.id}">Retirer du planning</button>` : ''}<button class="icon-btn" type="button" data-act="offdel" data-id="${o.id}" aria-label="${esc(`Supprimer le day off de ${cName(o.chatterId)}`)}">${ICONS.trash}</button></div>
    </div>`;
  }).join('');
  const counts = activeChatters().map(c => ({ c, n: offsCount(c.id, ms) })).sort((a, b) => b.n - a.n || String(a.c.name || '').localeCompare(String(b.c.name || ''), 'fr'));
  const mn = fd(ms, { month: 'long' }); const de = /^[aeiouyéèêâàh]/i.test(mn) ? 'd\'' : 'de ';

function plStep(dir) {
  const P = S.pl;
  if (P.mode === 'week') P.ref = addDays(P.ref, 7 * dir);
  else if (P.mode === 'att' || P.mode === 'day') P.ref = addDays(P.ref, dir);
  else P.ref = addMonths(P.ref, dir);
  ensureRange(P.ref); render();
}

  if (s) patch[s.sid] = { slot, chatterId: cid, accts: [...new Set([...(s.accts || []), k])], ...keepBoxes(s.boxes, s.accts) };
  else patch[uid()] = { slot, chatterId: cid, accts: [k] };

// copie d'une journée vers d'autres (remplace leur planning ; pas de chatteur en day off ce jour-là)
async function pldCopy(from, targets) {

  for (const d of targets) {

    src.forEach(s => { if (isOff(s.chatterId, d)) { skip++; return; } patch[uid()] = { slot: s.slot, chatterId: s.chatterId, accts: [...(s.accts || [])], ...keepBoxes(s.boxes, s.accts) }; });
